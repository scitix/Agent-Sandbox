syntax = "proto3";

package sandbox.sync.v1;

option go_package = "github.com/scitix/agent-sandbox/pkg/proto/sandbox/sync/v1;syncv1";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Sync protocol between Hub (wsproxy) and Worker (api server).
//
// Transport: the existing /v1/ws/sync WebSocket connection. Inside the WS,
// every frame is a yamux stream byte, and gRPC runs on top of yamux. Hub is
// the gRPC server; Worker is the gRPC client and initiates every RPC.
//
// Three resource families:
//   - APIKeyService: per-user opaque API keys (stored as K8s Secrets on Hub).
//   - TemplateService: SandboxTemplate CRD (cluster-scoped on Hub; mirrored
//     onto every Worker). Bodies travel as JSON bytes so the wire format does
//     not have to mirror the K8s schema — Worker deserialises into the same
//     *v1alpha1.SandboxTemplate type it would have parsed from JSON.
//   - ClusterConfigService: the cluster.ClusterConfig snapshot (the cluster
//     list and host-aliases sourced from clusters.yaml on the Hub).
//
// Each resource family exposes:
//   - unary RPCs for mutations initiated from a Worker (e.g. Dashboard request);
//   - a server-stream Watch RPC that emits Snapshot first then Upsert/Delete
//     events as the Hub-side store changes. The Worker keeps one Watch stream
//     open per resource.
// ─────────────────────────────────────────────────────────────────────────────

// ── API Key ──────────────────────────────────────────────────────────────────

// APIKeyMetadata mirrors apikey.KeyMetadata. It is the payload of WatchKeys
// upsert events and the snapshot item type.
message APIKeyMetadata {
  // Full SHA-256 hex hash of the raw token. Used by the Worker to write a
  // matching local Secret via CreateFromHash without ever exposing the token.
  string token_hash = 1;

  // Short prefix derived from token_hash (currently the first 16 hex chars).
  // The Worker-side Secret name is "agentbox-apikey-{hash_prefix}".
  string hash_prefix = 2;

  // K8s Secret name on the Worker side — typically "agentbox-apikey-{hash_prefix}".
  // Carried explicitly so DeleteKey events can target the secret directly.
  string secret_name = 3;

  string namespace = 4;
  string user = 5;
  string team = 6;
  string role = 7;
  string quota_url = 8;
  string description = 9;

  google.protobuf.Timestamp issued_at = 10;

  // Zero value (unset) means the key never expires.
  google.protobuf.Timestamp expires_at = 11;

  // Plaintext token kept on the Hub side for promote / import scenarios where
  // a Worker may need to reconstruct the recoverable value. Empty for legacy
  // keys created before plaintext storage was introduced.
  string raw_token = 12;
}

message CreateKeyRequest {
  string namespace = 1;
  string user = 2;
  string team = 3;
  string role = 4;
  string description = 5;
  string quota_url = 6;
  google.protobuf.Timestamp expires_at = 7;

  // Import/promote mode. When both token_hash and hash_prefix are set the Hub
  // calls CreateFromHash (idempotent) instead of generating a new token.
  string token_hash = 8;
  string hash_prefix = 9;
  google.protobuf.Timestamp issued_at = 10;
  // Plaintext token to store alongside the hash in import/promote mode.
  string raw_token = 11;
}

message CreateKeyResponse {
  // Raw token (agbx_...) returned only when generated by the Hub. Empty for
  // import/promote mode (caller already has it).
  string raw_token = 1;
  // Fully qualified K8s Secret name on the Hub: "agentbox-apikey-{hash_prefix}".
  string key_id = 2;
  string hash_prefix = 3;
  google.protobuf.Timestamp issued_at = 4;
  string token_hash = 5;
}

message DeleteKeyRequest {
  // Either the secret name ("agentbox-apikey-...") or the bare hash prefix.
  string key_id = 1;
}

message DeleteKeyResponse {}

message KeyEvent {
  oneof kind {
    KeySnapshot snapshot = 1;
    APIKeyMetadata upsert = 2;
    KeyDelete delete = 3;
  }
}

message KeySnapshot {
  repeated APIKeyMetadata items = 1;
}

message KeyDelete {
  // Secret name to delete locally; matches APIKeyMetadata.secret_name.
  string secret_name = 1;
}

message WatchKeysRequest {}

service APIKeyService {
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse);

  // WatchKeys emits a KeySnapshot first (carrying every key currently held by
  // the Hub) and then a stream of Upsert/Delete events as the Hub-side store
  // changes. The Worker should re-subscribe whenever the underlying connection
  // drops; the next Snapshot is the authoritative truth.
  rpc WatchKeys(WatchKeysRequest) returns (stream KeyEvent);
}

// ── Credential vault ─────────────────────────────────────────────────────────
//
// Vault entries are replicated Hub → every Worker so a sandbox created on any
// cluster can reference the caller's credentials. Without replication a rule
// would resolve on the cluster the entry happened to be written to and fail
// everywhere else, which is indistinguishable from a typo to the caller.
//
// The value travels in the clear on this stream, as APIKeyMetadata.raw_token
// already does: the transport is the authenticated WebSocket to the Hub. It is
// never logged, and each side writes it only into a Kubernetes Secret.

message VaultEntry {
  string namespace = 1;
  // user scopes the entry within the namespace. Namespaces are usually a single
  // user, but the shared one is not, and two users there must not see each
  // other's credentials.
  string user = 2;
  // name is the canonical (lower-cased) entry name.
  string name = 3;
  int64  version = 4;
  // metadata_json is the caller's own metadata map, encoded.
  string metadata_json = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // value is the credential itself. Empty in a Delete event.
  string value = 8;
}

message PutVaultEntryRequest  { VaultEntry entry = 1; }
message PutVaultEntryResponse { VaultEntry entry = 1; }

message DeleteVaultEntryRequest {
  string namespace = 1;
  string user = 2;
  string name = 3;
}
message DeleteVaultEntryResponse {}

message VaultDelete {
  string namespace = 1;
  string user = 2;
  string name = 3;
}

message VaultSnapshot { repeated VaultEntry items = 1; }

message VaultEvent {
  oneof kind {
    VaultSnapshot snapshot = 1;
    VaultEntry    upsert   = 2;
    VaultDelete   delete   = 3;
  }
}

message WatchVaultRequest {}

service VaultService {
  // PutEntry creates or rotates an entry. The Hub owns the version counter, so
  // two Workers writing the same name cannot both believe they produced v2.
  rpc PutEntry(PutVaultEntryRequest) returns (PutVaultEntryResponse);
  rpc DeleteEntry(DeleteVaultEntryRequest) returns (DeleteVaultEntryResponse);

  // WatchEntries emits a Snapshot first, then Upsert/Delete events. The
  // Snapshot is authoritative: a Worker reconciling against it must drop local
  // entries the Hub no longer knows about, or a delete that arrived while the
  // connection was down would never take effect.
  rpc WatchEntries(WatchVaultRequest) returns (stream VaultEvent);
}

// ── SandboxTemplate ──────────────────────────────────────────────────────────
//
// CRD bodies travel as JSON bytes (template_json). The Worker side
// json.Unmarshal()s into the standard *v1alpha1.SandboxTemplate type, exactly
// like it does when reading from the K8s API server. We carry JSON rather
// than full protobuf to keep this schema independent of any future K8s
// upstream-proto plumbing.

message CreateTemplateRequest {
  bytes template_json = 1;
}

message CreateTemplateResponse {
  string name = 1;
}

message UpdateTemplateRequest {
  bytes template_json = 1;
}

message UpdateTemplateResponse {
  string name = 1;
}

message DeleteTemplateRequest {
  string name = 1;
}

message DeleteTemplateResponse {
  string name = 1;
}

message TemplateUpsert {
  // Full JSON-encoded *v1alpha1.SandboxTemplate, including ObjectMeta + Spec.
  bytes template_json = 1;
}

message TemplateDelete {
  string name = 1;
}

message TemplateSnapshot {
  repeated bytes template_jsons = 1;
}

message TemplateEvent {
  oneof kind {
    TemplateSnapshot snapshot = 1;
    TemplateUpsert upsert = 2;
    TemplateDelete delete = 3;
  }
}

message WatchTemplatesRequest {}

service TemplateService {
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);

  // WatchTemplates emits a TemplateSnapshot first and then Upsert/Delete events.
  rpc WatchTemplates(WatchTemplatesRequest) returns (stream TemplateEvent);
}

// ── ClusterConfig ────────────────────────────────────────────────────────────

message HostAlias {
  string ip = 1;
  repeated string hostnames = 2;
}

message RegistryEntry {
  string host = 1;
  // Pairing label across clusters; empty strings only match other empty strings.
  string type = 2;
}

message GatewayConfig {
  string native_url = 1;
  string e2b_url = 2;
  string data_url = 3;
  map<string, string> headers = 4;
  map<string, string> native_headers = 5;
  map<string, string> e2b_headers = 6;
  map<string, string> data_headers = 7;
}

// LogsConfig scopes central-log-service queries to one cluster. Without it a
// query by pod name would match same-named pods on other clusters.
message LogsConfig {
  map<string, string> filters = 1;
}

message ClusterEntry {
  string id = 1;
  string name = 2;
  string url = 3;
  // Full PromQL label matcher expression that uniquely identifies this
  // cluster's metrics, e.g. `cluster="cluster1",region="region1"`.
  string selector = 4;
  map<string, string> headers = 5;
  string visible = 6;
  GatewayConfig gateway = 7;
  repeated RegistryEntry registries = 8;
  LogsConfig logs = 9;
}

message ClusterConfig {
  repeated ClusterEntry clusters = 1;
  repeated HostAlias host_aliases = 2;
}

message ClusterConfigEvent {
  // The full snapshot is republished on every change. The Worker MUST treat
  // an empty snapshot (no clusters and no host aliases) as a no-op so a
  // transient empty push cannot erase an already-populated ConfigMap.
  ClusterConfig snapshot = 1;
}

message WatchClusterConfigRequest {}

service ClusterConfigService {
  rpc WatchClusterConfig(WatchClusterConfigRequest) returns (stream ClusterConfigEvent);
}

// ── Cross-cluster capacity federation ─────────────────────────────────────────
//
// Each Worker independently owns its own SandboxEnv objects. When Envs of the
// same (namespace, name) exist in more than one cluster, this service shares a
// soft-state capacity view across them so a Worker's router can see whether a
// same-named Env in another cluster currently has idle capacity.
//
// The federation is pure soft state: every record carries a relative freshness
// (observed_for_ms) rather than an absolute timestamp so it survives cross-node
// clock skew, and each Worker ages records out on a local TTL. A cluster that
// stops reporting simply ages out everywhere — no explicit delete is needed.

// EnvCapacity is one cluster's runtime capacity for a single member pool of a
// same-named SandboxEnv. member_pool identifies the concrete SandboxPool in
// that cluster so the origin cluster can pin cross-cluster placement to an
// exact pool (forwarding "<cluster_id>::<member_pool>"); scaling_group lets the
// origin honour a requested group.
message EnvCapacity {
  string cluster_id      = 1;
  string namespace       = 2;
  string env_name        = 3;
  string scaling_group   = 4;
  int32  idle            = 5;
  int32  running         = 6;
  int32  pending         = 7;
  int32  desired         = 8;
  // member_pool is the SandboxPool name of this member within its cluster.
  string member_pool     = 12;
  // autoscaling_enabled reports whether this member's scaling group has the
  // autoscaler on in its owning cluster (per-member, per-cluster). Gates
  // whether capacity below is meaningful.
  bool   autoscaling_enabled = 13;
  // capacity is the member's remaining scale-up headroom on its owning
  // cluster, meaningful only when autoscaling_enabled: -1 = unbounded (no
  // finite ceiling), 0 = at ceiling (cannot grow now), >0 = room left.
  int32  capacity        = 9;
  // saturated_for is the remaining saturation window in seconds (0 = not
  // saturated). Relative to avoid cross-cluster clock skew.
  int32  saturated_for   = 10;
  // observed_for_ms is the age of this sample in milliseconds at send time.
  int64  observed_for_ms = 11;
}

message ReportFederationRequest  { repeated EnvCapacity items = 1; }
message ReportFederationResponse {}
message FederationBroadcast       { repeated EnvCapacity items = 1; }
message WatchFederationRequest    {}

service FederationService {
  // ReportFederation is a Worker→Hub client stream: the Worker pushes its
  // local per-Env capacity (5 s diff / 30 s full resync). The Hub merges each
  // batch into its soft-state store and fans it out to every other Worker.
  rpc ReportFederation(stream ReportFederationRequest) returns (ReportFederationResponse);

  // WatchFederation is a Hub→Worker server stream: the Worker receives a full
  // snapshot on connect and then every subsequent batch of foreign capacity.
  rpc WatchFederation(WatchFederationRequest) returns (stream FederationBroadcast);
}
