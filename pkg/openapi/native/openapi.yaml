        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Env not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /envs/{name}/events:
    get:
      operationId: ListEnvEvents
      summary: List recent K8s Events for a SandboxEnv and its member SandboxPools, newest first.
      description: |
        Returns the K8s Events emitted against the named SandboxEnv and every
        member SandboxPool the Env owns in the caller's namespace, merged and
        sorted descending by lastTimestamp. Used by the dashboard to render an
        activity timeline (scaling decisions, phase transitions, autoscaler
        actions). Reads come straight from the apiserver — no Prometheus
        round-trip — so the latest event is visible as soon as the controllers
        emit it.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: "Maximum number of events to return."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvEventsResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Env not found
          content:
            application/json:
              schema:
