          description: Accepted — the member entry was added to the Env spec; the SandboxPool CR is materialised asynchronously by the Env Reconciler. Response body returns the projected Pool (status fields may be unset until the next reconcile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxPoolEnvelope"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Env not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict — a member with this name already exists in the Env
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Server misconfigured (LOCAL_CLUSTER_ID not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
