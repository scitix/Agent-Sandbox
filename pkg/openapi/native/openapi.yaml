openapi: 3.0.3
info:
  title: AgentBox API
  version: "0.0.0"
  description: |
    AgentBox provides Sandbox lifecycle management and tenant API key provisioning.

    ## Authentication

    All API requests must include an API key in the `AGENTBOX-API-KEY` header:

    ```
    AGENTBOX-API-KEY: <your-api-key>
    ```

    ## Admin Impersonation

    Admin callers can act on behalf of any user by adding the following optional headers
    to **any regular (non-admin) endpoint**:

    ```
    X-Impersonate-Team: <team>
    X-Impersonate-User: <user>
    ```

    When both headers are present and the caller has admin role, the server resolves the
    target user's Kubernetes namespace via IAM and executes the request as if that user
    made the call. Non-admin callers that supply these headers have them silently ignored.
  contact:
    name: AgentBox Support
tags:
  - name: auth
    x-displayName: Auth
    description: >
      Caller identity and authentication. Use `GET /auth/whoami` to verify your
      API key and discover your role (tenant / admin).
  - name: sandboxes
    x-displayName: Sandboxes
    description: >
      Sandbox lifecycle management — create, inspect, delete, and interact with
      individual sandbox instances. Non-admin callers operate within their own
      namespace; admin callers may additionally supply `X-Impersonate-Team` /
      `X-Impersonate-User` headers to act on behalf of another user.
  - name: pools
    x-displayName: Pools
    description: >
      SandboxPool management — create and manage pre-warmed pod pools.
      Each pool holds a configurable number of idle sandboxes ready for
      instant allocation. Admin callers may impersonate via
      `X-Impersonate-Team` / `X-Impersonate-User`.
  - name: sandbox-envs
    x-displayName: Envs
    description: >
      SandboxEnv management — declarative environments that fan out into one or
      more member SandboxPools. The Env Reconciler materialises a member pool
      per entry in `members`, or a single quota-less pool named after the Env
      when `members` is empty.
  - name: sandbox-templates
    x-displayName: Templates
    description: >
      Read-only access to SandboxTemplate cluster resources. Templates define
      the pod spec, idle image, runtime port mappings, and reservation config
      shared across pools.
  - name: quotas
    x-displayName: Quotas
    description: >
      SI Scheduler quota information for the authenticated user. Returns
      resource allocations, usage, and free capacity per quota entry.
  - name: instancetypes
    x-displayName: Instance Types
    description: >
      Catalog of named base resource shapes that a sandbox can scale up from by
      an integer multiplier. Returned entries are read-only; resolution of
      (name, multiplier) into Pod resources happens server-side. The
      `instanceType` flag on `/feature-gates` reports whether the catalog
      backend is wired in.
  - name: clusters
    x-displayName: Clusters
    description: >
      Cluster catalog visible to the current gateway. Use this to discover valid
      `clusterID` prefixes for cross-cluster sandbox and pool identifiers
      (`{clusterID}.{uuid}` for sandboxes, `{clusterID}::{poolName}` for pools).
      The `local: true` entry marks the cluster actually serving this request.
  - name: statistics
    x-displayName: Statistics
    description: >
      Aggregated sandbox and pool statistics. Tenant-scoped statistics are
      available to all authenticated users; cluster-wide statistics require
      admin role.
  - name: apikeys
    x-displayName: API Keys
    description: >
      Self-service API key management for tenants. Each key is scoped to the
      caller's namespace and cannot access resources in other namespaces.
  - name: feature-gates
    x-displayName: Feature Gates
    description: >
      Optional features enabled on this cluster. Clients use this to discover
      which feature-specific endpoints and UI elements are available.
  - name: admin
    x-displayName: Admin
    description: >
      Admin-only operations: cross-namespace sandbox/pool inspection, API key
      provisioning, template management, and organization queries. All endpoints
      require an admin-role API key (`AGENTBOX-API-KEY` header).

# Group related tags in tools that render x-tagGroups (Redoc, Stoplight). Other
# tools simply ignore this block and render the flat tag list above.
x-tagGroups:
  - name: providers
    x-displayName: Providers
    tags: [quotas, instancetypes]

servers:
  - url: "{protocol}://{path}"
    description: Responds with your request data
    variables:
      protocol:
        enum:
          - https
          - http
        default: https
      path:
        default: ""

security:
  - ApiKeyAuth: []

components:
  parameters:
    QueryLimit:
      name: limit
      in: query
      required: false
      description: "Maximum number of items to return per page."
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 1000
    QueryOffset:
      name: offset
      in: query
      required: false
      description: "Number of items to skip before returning results (zero-based)."
      schema:
        type: integer
        default: 0
        minimum: 0

    # ----- Path parameters -----
    PathSandboxId:
      name: sandboxId
      in: path
      required: true
      description: |
        Sandbox identifier.

        * Single-cluster: a bare UUID v7 such as `5de15c92-8fb5-440f-a9ea-7f62f734f1b9`.
        * Cross-cluster: a `{clusterID}.{uuid}` composite such as
          `cluster1.5de15c92-8fb5-440f-a9ea-7f62f734f1b9` (dot-separated). The `clusterID`
          prefix tells the gateway which Worker cluster owns this sandbox; the server
          parses it out transparently. Discover valid cluster IDs via `GET /clusters`.

        Because of the composite form, this field is NOT a strict RFC 4122 UUID —
        clients must treat it as an opaque string. Parsing reference: `pkg/utils/cluster/sandbox_id.go::SplitSandboxID`.
      schema:
        type: string
        example: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
    PathPoolName:
      name: name
      in: path
      required: true
      description: |
        SandboxPool name.

        * Single-cluster: a DNS-1123 label such as `my-pool`.
        * Cross-cluster: a `{clusterID}::{poolName}` composite such as `cluster1::my-pool`
          (double-colon separator). Discover valid cluster IDs via `GET /clusters`.
          Parsing reference: `pkg/utils/cluster/parse.go::ParsePoolRef`.

        Note: the E2B-compatible API further extends this to
        `{clusterID}::{poolName}//{imageOverride}` for template strings; that form is
        only accepted on the E2B port, not on this native API.
      schema:
        type: string
        example: "my-pool"
    PathTemplateName:
      name: name
      in: path
      required: true
      description: "Global SandboxTemplate name (cluster-scoped resource)."
      schema:
        type: string
        example: "default-template"
    PathAPIKeyName:
      name: name
      in: path
      required: true
      description: |
        API key identifier in `{namespace}/{shortName}` format, or just `{shortName}`
        when the caller's namespace is implied. Admin endpoints accept the fully-qualified form.
      schema:
        type: string
        example: "t-team-user/my-key"
    PathTeam:
      name: team
      in: path
      required: true
      description: "Team name."
      schema:
        type: string
        example: "my-team"

    # ----- Common query filters -----
    QueryTeam:
      name: team
      in: query
      required: false
      description: "Filter by team name. Admin callers may also use X-Impersonate-Team."
      schema:
        type: string
    QueryUser:
      name: user
      in: query
      required: false
      description: "Filter by user name. Admin callers may also use X-Impersonate-User."
      schema:
        type: string
    QueryNamespace:
      name: namespace
      in: query
      required: false
      description: "Filter by Kubernetes namespace (admin only)."
      schema:
        type: string
    QueryPoolName:
      name: poolName
      in: query
      required: false
      description: "Filter by sandbox pool name."
      schema:
        type: string
    QuerySandboxStatus:
      name: status
      in: query
      required: false
      description: "Filter by sandbox phase. One of: Idle, Starting, Running, Stopping, Failed."
      schema:
        type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: AGENTBOX-API-KEY
    AdminKeyAuth:
      type: apiKey
      in: header
      name: AGENTBOX-API-KEY
      description: "Admin-level API key. Same header as ApiKeyAuth but requires admin role."

  schemas:
    # =========================================================
    # Sandbox
    # =========================================================
    SandboxStatusDetail:
      type: object
      properties:
        reason:
          type: string
          description: "Machine-readable reason code for the current status (mirrors Kubernetes condition reason)."
        message:
          type: string
          description: "Human-readable message explaining the current status."
        lastUpdatedTime:
          type: string
          format: date-time
          description: "RFC 3339 timestamp of when this status detail was last updated."
      additionalProperties: false

    SandboxEndpoint:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: "Fully-qualified URL to reach this runtime endpoint (e.g. https://sandbox.example.com/api)."
        logDir:
          type: string
          description: "Path to the runtime log file inside the container, if configured"
      additionalProperties: false

    SandboxReadinessResult:
      type: object
      required: [sandboxId, ready]
      properties:
        sandboxId:
          type: string
          description: |
            Sandbox identifier. Single-cluster: bare UUID v7 (e.g. `5de15c92-8fb5-440f-a9ea-7f62f734f1b9`).
            Cross-cluster: `{clusterID}.{uuid}` composite (e.g. `cluster1.5de15c92-...`, dot-separated). NOT a strict RFC 4122 UUID — treat as opaque.
          example: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
        ready:
          type: boolean
          description: "True when all configured readiness probes have passed."
        endpoints:
          type: object
          description: "Per-runtime readiness status, keyed by runtime name."
          additionalProperties:
            type: object
            properties:
              ready:
                type: boolean
                description: "Whether this runtime endpoint's readiness probe passed."
              message:
                type: string
                description: "Diagnostic message when the probe failed."
            additionalProperties: false

    Sandbox:
      type: object
      required: [sandboxId, namespace, poolName, podName, status, claimedAt]
      properties:
        sandboxId:
          type: string
          description: |
            Sandbox identifier. Single-cluster: bare UUID v7 (e.g. `5de15c92-8fb5-440f-a9ea-7f62f734f1b9`).
            Cross-cluster: `{clusterID}.{uuid}` composite (e.g. `cluster1.5de15c92-...`, dot-separated). NOT a strict RFC 4122 UUID — treat as opaque.
          example: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
        namespace:
          type: string
          description: "Kubernetes namespace where the sandbox pod is running."
        poolName:
          type: string
          description: "Name of the SandboxPool this sandbox was allocated from."
        envName:
          type: string
          description: "Name of the SandboxEnv that owns the pool this sandbox was allocated from (from pod label agentbox.navix.sh/env)."
        podName:
          type: string
          description: "Name of the Kubernetes Pod backing this sandbox."
        status:
          type: string
          enum:
            [
              Pending,
              Starting,
              Running,
              Stopping,
              Failed,
              Completed,
              Canceled,
              Released,
            ]
          description: "Current lifecycle phase of the sandbox."
        claimedAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the sandbox was claimed by a user."
        startedAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the sandbox transitioned to Running."
        containerImages:
          type: object
          description: "Map of container name to image URI for each container in the sandbox pod."
          additionalProperties:
            type: string
        metadata:
          type: object
          description: "User-defined key-value pairs attached to the sandbox for filtering and annotation."
          additionalProperties:
            type: string
        endpoints:
          type: object
          description: "Map of runtime name to its endpoint URL, populated once the sandbox is Running."
          additionalProperties:
            $ref: "#/components/schemas/SandboxEndpoint"
        cpu:
          type: string
          description: 'CPU resource allocated to the sandbox (Kubernetes resource quantity, e.g. "1", "100m").'
        memory:
          type: string
          description: 'Memory resource allocated to the sandbox (Kubernetes resource quantity, e.g. "16Gi", "512Mi").'
        terminatedAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the sandbox workload terminated (exit or stop signal)."
        recycledAt:
          type: string
          format: date-time
          description: "Timestamp when the sandbox completed recycling (Stopping → Idle in-place upgrade) and the record was written to the store. Also set for evicted/externally-deleted sandboxes to record when the Failed record was persisted."
        durationSeconds:
          type: integer
          format: int64
          description: "Wall-clock duration of the sandbox in seconds. Set for Running (startedAt to query time), Completed, Failed, and Released states (startedAt to terminatedAt). Omitted for Starting and Canceled states."
        failureReason:
          type: string
          description: "Machine-readable reason code when status is Failed."
        exitCode:
          type: integer
          format: int32
          description: "Exit code of the main container when the sandbox terminated."
        failureMessage:
          type: string
          description: "Human-readable message describing the failure cause."
        statusDetail:
          $ref: "#/components/schemas/SandboxStatusDetail"
        team:
          type: string
          description: "Team label of the sandbox owner (from pod label)"
        user:
          type: string
          description: "User label of the sandbox owner (from pod label)"
        nodeName:
          type: string
          description: "Kubernetes node the sandbox Pod was scheduled onto."
        containerId:
          type: string
          description: 'Runtime container ID (e.g. "docker://abc123") of the primary container, captured when the sandbox entered Running state.'
      example:
        sandboxId: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
        namespace: "t-team-user"
        poolName: "poolname"
        podName: "poolname-wxtfc"
        status: "Completed"
        claimedAt: "2026-04-07T14:37:54Z"
        startedAt: "2026-04-07T14:37:55Z"
        terminatedAt: "2026-04-07T14:38:10Z"
        recycledAt: "2026-04-07T14:38:11Z"
        durationSeconds: 15
        cpu: "1"
        memory: "16Gi"
        team: "team"
        user: "user"
        containerImages:
          sandbox: "docker.io/project/name:tag"

    SandboxEnvelope:
      type: object
      required: [sandbox]
      properties:
        sandbox:
          $ref: "#/components/schemas/Sandbox"

    # =========================================================
    # Sandbox Logs
    # =========================================================
    SandboxLogEntry:
      type: object
      required: [container, log]
      properties:
        timestamp:
          type: string
          format: date-time
          description: "RFC 3339 timestamp of the log line."
        container:
          type: string
          description: "Name of the container that produced this log line."
        log:
          type: string
          description: "Raw log line content."

    SandboxLogsResult:
      type: object
      required: [sandboxId, namespace, entries, truncated, source]
      properties:
        sandboxId:
          type: string
          description: |
            Sandbox identifier. Single-cluster: bare UUID v7; cross-cluster: `{clusterID}.{uuid}` composite (dot-separated).
            NOT a strict RFC 4122 UUID — treat as opaque.
          example: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
        namespace:
          type: string
          description: "Kubernetes namespace of the sandbox."
        podName:
          type: string
          description: "Name of the Kubernetes Pod backing the sandbox."
        capturedAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the log snapshot was captured."
        entries:
          type: array
          description: "Ordered list of log lines (oldest first)."
          items:
            $ref: "#/components/schemas/SandboxLogEntry"
        truncated:
          type: boolean
          description: "True when the response was truncated due to the `lines` limit or internal size cap."
        totalBytes:
          type: integer
          format: int64
          description: "Total byte size of all log entries before any truncation."
        source:
          type: string
          enum: [live, cached, runtime]
        runtimeName:
          type: string
          description: "When source=runtime, the runtime name whose log file was read"

    SetSandboxTimeoutRequest:
      type: object
      required: [timeout]
      properties:
        timeout:
          type: string
          description: "New idle timeout duration. Duration string, e.g. '30m', '2h'. Use '0' to disable the timeout."
          example: "30m"

    ExecTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Single-use exec token, valid for 30 seconds

    ExecCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: "Shell command to execute inside the sandbox (e.g. 'ls -la /tmp')"
          example: "echo hello"
        timeoutSeconds:
          type: integer
          description: "Execution timeout in seconds. Default: 30, Max: 300."
          minimum: 1
          maximum: 300
          example: 30

    ExecCommandResult:
      type: object
      required: [exitCode, stdout, stderr]
      properties:
        exitCode:
          type: integer
          description: "Exit code of the command (0 = success)"
        stdout:
          type: string
          description: "Standard output of the command"
        stderr:
          type: string
          description: "Standard error of the command"

    DeleteSandboxResult:
      type: object
      required: [sandboxId, namespace, poolName, podName, status]
      properties:
        sandboxId:
          type: string
          description: |
            Sandbox identifier. Single-cluster: bare UUID v7; cross-cluster: `{clusterID}.{uuid}` composite (dot-separated).
            NOT a strict RFC 4122 UUID — treat as opaque.
          example: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
        namespace:
          type: string
          description: "Kubernetes namespace the sandbox belonged to."
        poolName:
          type: string
          description: "Name of the SandboxPool the sandbox was allocated from."
        podName:
          type: string
          description: "Name of the Kubernetes Pod that backed the sandbox."
        status:
          type: string
          description: "Final status of the delete operation (e.g. Stopping)."

    CreateSandboxRequest:
      type: object
      required: [poolName]
      properties:
        poolName:
          type: string
          description: "Name of the SandboxPool to allocate the sandbox from."
          example: "my-pool"
        image:
          type: string
          description: "Override the main container image for this sandbox. Replaces the pool's default image."
          example: "docker.io/myorg/myimage:latest"
        containerImages:
          type: object
          description: "Per-container image overrides keyed by container name. Takes precedence over `image`."
          additionalProperties:
            type: string
        labels:
          type: object
          description: "Kubernetes labels to apply to the sandbox pod."
          additionalProperties:
            type: string
        annotations:
          type: object
          description: "Kubernetes annotations to apply to the sandbox pod."
          additionalProperties:
            type: string
        metadata:
          type: object
          description: "User-defined key-value metadata for filtering and annotation. Available on the sandbox object after creation."
          additionalProperties:
            type: string
        startupTimeout:
          type: string
          description: "Maximum duration to wait for the sandbox to reach Running status before marking it as Failed. Duration string, e.g. '30s', '2m'."
          example: "2m"
        idleTimeout:
          type: string
          description: "Duration of inactivity after which the sandbox is automatically stopped. Duration string, e.g. '5m', '1h'. Use '0' to disable."
          example: "30m"

    ListSandboxesResult:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: "Page of sandbox objects matching the query."
          items:
            $ref: "#/components/schemas/Sandbox"
        total:
          type: integer
          description: "Total number of sandboxes matching the query (before pagination)."
        limit:
          type: integer
          description: "Maximum number of items requested per page."
        offset:
          type: integer
          description: "Number of items skipped before this page."

    # =========================================================
    # SandboxPool
    # =========================================================
    SandboxPoolSpec:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          format: int32
          minimum: 0
          description: "Desired number of pre-warmed idle pods in the pool."
        templateName:
          type: string
          description: "Name of the SandboxTemplate cluster resource to use as the pod spec source."
        podCreationImagePolicy:
          type: string
          enum: [PoolDefaultImage, IdleImage]
          default: IdleImage
          description: "Controls which image newly created Pods start with. IdleImage (default) uses spec.idleImage; PoolDefaultImage uses the template container image."
        defaultStartupTimeout:
          type: string
          description: "Default startup timeout for sandbox create requests in this pool when the request does not specify startupTimeout. Also serves as the upper bound for the Starting phase: the controller deletes pods stuck in Starting for longer than this value. If not set, the internal default (2m) is used for create requests; no cleanup is enforced by default. Duration string, e.g. '5m'."
        defaultIdleTimeout:
          type: string
          description: "Default idle timeout for sandboxes created in this pool. Applied when a CreateSandbox request does not specify idleTimeout. If not set, sandboxes have no idle timeout by default. Duration string, e.g. '30m'."

    SandboxPoolStatus:
      type: object
      properties:
        phase:
          type: string
          enum: [Pending, Ready, ScalingUp, ScalingDown, Degraded, Terminating]
          description: "High-level pool health summary. Pending=no pods; Ready=all healthy idle pods present; ScalingUp/ScalingDown=replica count changing; Degraded=has unavailable idle or failed pods; Terminating=pool is being deleted."
        idleReplicas:
          type: integer
          format: int32
          description: "Number of pods in Idle phase (ready to be claimed)."
        unavailableIdleReplicas:
          type: integer
          format: int32
          description: "Number of Idle pods whose PodReady condition is False (e.g. Pending, CrashLoopBackOff). These are counted in idleReplicas but cannot accept requests. Non-zero value triggers Degraded phase."
        runningReplicas:
          type: integer
          format: int32
          description: "Number of pods actively serving a sandbox workload."
        startingReplicas:
          type: integer
          format: int32
          description: "Number of pods currently starting up."
        stoppingReplicas:
          type: integer
          format: int32
          description: "Number of pods transitioning from Running to Idle (in-place upgrade in progress)."
        failedReplicas:
          type: integer
          format: int32
          description: "Number of pods in a Failed state."
        pendingRequests:
          type: integer
          format: int32
          description: "Throttled mirror of the in-process PoolScheduler queue depth. Patched every ~3s when the queue length changes by at least 20% or crosses the 0/>0 boundary. Useful for Dashboard observability — the Env autoscaler reads the live in-process Snapshot instead."
        updateRevision:
          type: string
          description: "Target revision hash of the current Pool template. Idle pods whose own hash differs are stale and get rolled onto this revision."
        currentRevision:
          type: string
          description: "The single revision hash all pods currently share; equals updateRevision once a rollout converges, empty while pods straddle revisions."
        updatedReplicas:
          type: integer
          format: int32
          description: "Number of pods already at updateRevision."
        autoscaling:
          $ref: "#/components/schemas/PoolAutoScalingStatus"

    PoolAutoScalingStatus:
      type: object
      description: "Per-Pool autoscaler decision state. Sole writer is the SandboxPool reconciler running the autoscaling decision pipeline."
      properties:
        lastScaleUpTime:
          type: string
          format: date-time
          description: "Most recent wall-clock time spec.replicas grew (probe accepted at least one additional replica). Drives the success cooldown gate (scaleUpPolicy.cooldownSeconds)."
        lastScaleDownTime:
          type: string
          format: date-time
          description: "Most recent wall-clock time spec.replicas shrank by one. Drives scaleDownPolicy.stabilizationSeconds."
        idleZeroSince:
          type: string
          format: date-time
          description: "When the Pool's idle replica count first hit zero in the current continuous-zero window; cleared when idle > 0. Drives the proactive scaleUpPolicy.idleThresholdSeconds trigger."
        lastScaleUpAttemptTime:
          type: string
          format: date-time
          description: "Most recent wall-clock time the admission probe ran for a scale-up attempt, regardless of outcome. Combined with lastScaleUpAttemptResult and scaleUpPolicy.saturationCooldownSeconds drives the saturation cooldown."
        lastScaleUpAttemptResult:
          type: string
          enum: [Enough, JustRight, Insufficient, Failed]
          description: "Outcome of the most recent admission probe. Enough = probe accepted the full target; JustRight = partial admission (reserved for finer-grained reporting); Insufficient = cluster has no headroom; Failed = invalid spec or internal probe error."
        scaleUpErrorMessage:
          type: string
          description: "Short single-line description of the most recent non-Enough probe result. Empty when lastScaleUpAttemptResult is Enough."
        observedGeneration:
          type: integer
          format: int64
          description: "metadata.generation observed when the autoscaler last wrote this block. Clients use it to confirm status freshness relative to spec."

    PoolTemplateOverrides:
      type: object
      description: "Legacy pool-create overrides. Image-only — per-Pool resource sizing flows through EnvClusterMember.{instanceType,multiplier,inlineResources} now."
      properties:
        image:
          type: string
          description: "Override the main container (containers[0]) image"
      additionalProperties: false

    SandboxPool:
      type: object
      required: [name, namespace, spec, status]
      properties:
        name:
          type: string
          description: "Name of the SandboxPool (RFC 1123 DNS label)."
        namespace:
          type: string
          description: "Kubernetes namespace the pool is deployed in."
        spec:
          $ref: "#/components/schemas/SandboxPoolSpec"
        status:
          $ref: "#/components/schemas/SandboxPoolStatus"
        cpu:
          type: string
          description: 'CPU resource per pod in the pool (Kubernetes resource quantity, e.g. "1", "100m").'
        memory:
          type: string
          description: 'Memory resource per pod in the pool (Kubernetes resource quantity, e.g. "16Gi", "512Mi").'
        team:
          type: string
          description: "Team label of the pool owner (from CRD label)"
        user:
          type: string
          description: "User label of the pool owner (from CRD label)"
        scalingGroup:
          type: string
          description: "Scaling group this pool belongs to (from the agentbox.navix.sh/scaling-group label). Members in the same group share an autoscaling policy. Empty when the pool is excluded from autoscaling."
        templateVersion:
          type: string
          description: "Version of the source SandboxTemplate at last sync (from annotation)"
        overrides:
          $ref: "#/components/schemas/PoolTemplateOverrides"
        specYaml:
          type: string
          description: "Full EmbeddedSandboxTemplate (idleImage, runtimes, reservation, template) serialized as YAML for diff comparison."
        createdAt:
          type: string
          format: date-time
          description: "Creation time of the pool (from metadata.creationTimestamp)"
        owningEnv:
          type: string
          description: "Name of the SandboxEnv that owns this pool (resolved from OwnerReferences). Empty when the pool has not been adopted by an Env yet — typical during a brief window after pool creation before the PoolAdoptionReconciler runs."
      example:
        name: "poolname"
        namespace: "t-team-user"
        cpu: "1"
        memory: "16Gi"
        team: "team"
        user: "user"
        spec:
          replicas: 2
        status:
          phase: "Ready"
          idleReplicas: 1
          unavailableIdleReplicas: 0
          runningReplicas: 1
          startingReplicas: 0
          stoppingReplicas: 0
          failedReplicas: 0

    SandboxPoolEnvelope:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/SandboxPool"

    SandboxPoolSummary:
      type: object
      description: "Lightweight shape returned by the pool List endpoint: the full SandboxPool minus the heavy specYaml (full pod-template YAML) and overrides, neither of which list consumers read. Fetch GET /envs/{name}/sandboxpools/{poolName} for the full body (incl. specYaml for the diff view)."
      required: [name, namespace, spec, status]
      properties:
        name:
          type: string
          description: "Name of the SandboxPool (RFC 1123 DNS label)."
        namespace:
          type: string
          description: "Kubernetes namespace the pool is deployed in."
        spec:
          $ref: "#/components/schemas/SandboxPoolSpec"
        status:
          $ref: "#/components/schemas/SandboxPoolStatus"
        cpu:
          type: string
          description: 'CPU resource per pod in the pool (Kubernetes resource quantity, e.g. "1", "100m").'
        memory:
          type: string
          description: 'Memory resource per pod in the pool (Kubernetes resource quantity, e.g. "16Gi", "512Mi").'
        team:
          type: string
          description: "Team label of the pool owner (from CRD label)."
        user:
          type: string
          description: "User label of the pool owner (from CRD label)."
        scalingGroup:
          type: string
          description: "Scaling group this pool belongs to. Members in the same group share an autoscaling policy. Empty when excluded from autoscaling."
        templateVersion:
          type: string
          description: "Version of the source SandboxTemplate at last sync (from annotation)."
        createdAt:
          type: string
          format: date-time
          description: "Creation time of the pool (from metadata.creationTimestamp)."
        owningEnv:
          type: string
          description: "Name of the SandboxEnv that owns this pool (resolved from OwnerReferences)."

    CreateEnvSandboxPoolRequest:
      type: object
      description: |
        Add a member SandboxPool to an Env. The server derives:
          - `name`         = "{envName}-{resourceKey}[-{quotaShort}]"
          - `scalingGroup` = `resourceKey` (e.g. "2c8Gi")

        where `resourceKey` is `instancetype.DeriveResourceKey(effective resources)` and
        `quotaShort` (when a quota label is supplied) is `quotaProvider.DeriveShortName(quotaID)`.
        Members in the same `scalingGroup` share an autoscaling policy.

        Sizing accepts three shapes:
          - `instanceType` (+ optional `multiplier`) alone → the Pod is sized to the full
            `instanceType × multiplier` envelope (default `multiplier` = 1).
          - `instanceType` (+ `multiplier`) AND `inlineResources` together → `instanceType ×
            multiplier` is the reservation/billing envelope, while `inlineResources` is the
            actual (possibly rounded-down) Pod request. Every dimension of `inlineResources`
            must be ≤ the envelope (round down allowed, round up rejected with 400); the
            reservation still charges quota for the whole instance.
          - `inlineResources` alone (catalog disabled or no `instanceType`) → explicit
            per-Pool resource requests/limits.
        `scalingGroup` / pool name are derived from the effective Pod request (the rounded-down
        `inlineResources` when supplied, else the full envelope), so the name reflects the Pod's
        real size and Pools downsized differently land in distinct scaling groups.
      properties:
        instanceType:
          type: string
          description: "InstanceType catalog entry. Required when the catalog is enabled and inlineResources is not supplied. May be combined with inlineResources to reserve a whole instance while running a smaller (rounded-down) Pod."
        multiplier:
          type: integer
          format: int32
          minimum: 1
          description: "Multiplier applied to the InstanceType base resources to form the reservation envelope. Defaults to 1."
        inlineResources:
          $ref: "#/components/schemas/ResourceRequirements"
          description: "Explicit per-Pool resource requests/limits. Used alone when instanceType is not supplied, or combined with instanceType as the rounded-down actual Pod request (must fit within instanceType × multiplier). Sets both requests and limits."
        replicas:
          type: integer
          format: int32
          minimum: 0
          description: "Initial replica count. Autoscaling, once enabled on this scalingGroup, owns subsequent changes."
        minReplicas:
          type: integer
          format: int32
          minimum: 0
          description: "Lower bound on this pool's replicas, enforced as a per-member scale-down floor by the Env autoscaler."
        maxReplicas:
          type: integer
          format: int32
          description: "Upper bound on this pool's replicas, enforced when the Env autoscaler distributes scale-up delta."
        labels:
          type: object
          additionalProperties:
            type: string
          description: "Labels stamped onto this member's SandboxPool. Use for plugin-driven metadata such as quota.scitix.ai/url (parsed by the server to derive the pool-name suffix)."
        annotations:
          type: object
          additionalProperties:
            type: string
          description: "Annotations stamped onto this member's SandboxPool."
        updateStrategy:
          $ref: "#/components/schemas/EnvUpdateStrategy"
          description: "Per-member rollout policy override. Unset inherits the Env overrides.updateStrategy, then autoUpdate=true / maxUnavailable=20%."

    UpdateEnvSandboxPoolRequest:
      type: object
      description: |
        Update a member SandboxPool. Resource shape, instanceType, labels and
        annotations are immutable post-create; this PUT accepts replica
        adjustments and updateStrategy changes. When the scalingGroup has
        autoscaling enabled (via env.spec.autoscaling.enabled + a matching group
        entry), only `maxReplicas` is accepted — `replicas` is owned by the autoscaler.
      properties:
        replicas:
          type: integer
          format: int32
          minimum: 0
          description: "Initial / desired replica count. Rejected when this pool's scalingGroup has autoscaling enabled."
        minReplicas:
          type: integer
          format: int32
          minimum: 0
          description: "Lower bound on this pool's replicas, enforced as a per-member scale-down floor by the Env autoscaler. Always accepted."
        maxReplicas:
          type: integer
          format: int32
          description: "Upper bound on this pool's replicas. Always accepted."
        updateStrategy:
          $ref: "#/components/schemas/EnvUpdateStrategy"
          description: "Per-member rollout policy override. Mutable post-create — e.g. set autoUpdate=false to freeze this member during an incident."

    ImagePullSecretInput:
      type: object
      required: [registries]
      properties:
        registries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RegistryCredential"

    RegistryCredential:
      type: object
      required: [registry, username, password]
      properties:
        registry:
          type: string
          description: "Registry host or URL (e.g. 'https://index.docker.io/v1/', 'ghcr.io', 'quay.io')."
        username:
          type: string
        password:
          type: string
          format: password

    DeleteSandboxPoolResult:
      type: object
      required: [name, namespace, status]
      properties:
        name:
          type: string
        namespace:
          type: string
        status:
          type: string

    ListSandboxPoolsResult:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: "Page of SandboxPool summaries."
          items:
            $ref: "#/components/schemas/SandboxPoolSummary"
        total:
          type: integer
          description: "Total number of pools matching the query (before pagination)."
        limit:
          type: integer
          description: "Maximum number of items requested per page."
        offset:
          type: integer
          description: "Number of items skipped before this page."

    EnvEvent:
      type: object
      required: [involvedKind, involvedName, reason, message, type, count]
      properties:
        involvedKind:
          type: string
          description: "Kind of the K8s object this event was emitted against. One of SandboxEnv | SandboxPool."
        involvedName:
          type: string
          description: "metadata.name of the involved object."
        reason:
          type: string
          description: "Event reason (machine-readable verb): ScaleUp / ScaleDown / PoolReady / PoolRecovered / Degraded / AutoscalerScaleUp / AutoscalerScaleDownStarted / AutoscalerScaleDownCompleted / AutoscalerScaleDownStuck / SandboxPoolPhase*."
        action:
          type: string
          description: "Event action (machine-readable). Sometimes absent on older events."
        message:
          type: string
          description: "Human-readable message body."
        type:
          type: string
          description: "Normal | Warning"
        count:
          type: integer
          description: "Number of times this event has fired. K8s coalesces repeated identical events and bumps this counter."
        firstTimestamp:
          type: string
          format: date-time
          description: "First time this event was observed (RFC3339)."
        lastTimestamp:
          type: string
          format: date-time
          description: "Most recent time this event was observed (RFC3339)."

    ListEnvEventsResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: "Events scoped to this Env and its member Pools, sorted descending by lastTimestamp."
          items:
            $ref: "#/components/schemas/EnvEvent"
        total:
          type: integer
          description: "Total number of events returned."

    # =========================================================
    # SandboxEnv
    #
    # Env is the user-facing "sandbox environment" abstraction that binds one
    # SandboxTemplate runtime to one or more member SandboxPools. Autoscaling
    # configuration lives here (lifted from Pool in the Phase 1 rollout) so a
    # single Env can manage replicas across multiple Pools (same resource
    # shape, different scheduling classes — e.g. ondemand + spot).
    # =========================================================
    PoolScaleUpPolicy:
      type: object
      description: "Scale-up behaviour for a scaling group (mode + cooldown + idle threshold + saturation cooldown)."
      properties:
        mode:
          type: string
          enum: [Conservative, Default, Aggressive]
          description: "Conservative=+1 per decision; Default=+max(1,ceil(N/2)); Aggressive=double up to maxReplicas."
        cooldownSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "Minimum seconds between two consecutive scale-up events (group-level)."
        idleThresholdSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "Aggregate idleReplicas=0 must persist for this long before the proactive trigger fires. Zero disables proactive scale-up."
        idleZeroQuietWindowSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "Suppresses the proactive idleZero trigger when no Sandbox.Create has been observed for the Pool within this many seconds. Reactive scale-ups (queue length > 0 with no idle Pod) ignore this window. Set to 0 to disable the gate. Default 300."
        saturationCooldownSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "How long a member stays marked saturated after a probe returned InsufficientResources / InvalidSpec. Default 60s."

    PoolScaleDownPolicy:
      type: object
      description: "Scale-down behaviour for a scaling group."
      properties:
        idleTimeoutSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "Minimum seconds a pod must remain Idle before it becomes a scale-down candidate."
        stabilizationSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "Minimum seconds between two consecutive scale-down events."
        protectionWindowSeconds:
          type: integer
          format: int32
          minimum: 0
          description: "Seconds during which a scale-down-marked pod can still be claimed (cancels deletion)."

    SandboxEnvTemplateRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "Name of the cluster-scoped SandboxTemplate the Env binds to."
        version:
          type: string
          description: "Optional Template version pin. When empty, the Env tracks the Template's current spec.version."

    SandboxEnvDefaults:
      type: object
      properties:
        instanceType:
          type: string
          description: "Default InstanceType used when Sandbox.create does not specify one. References an entry in the InstanceType catalog."
        multiplier:
          type: integer
          format: int32
          minimum: 1
          description: "Default multiplier applied to the InstanceType base resources."

    EnvClusterMember:
      type: object
      required: [name]
      description: |
        One SandboxPool participating in an Env. Identity is `name`; everything
        the caller can declare (sizing, scaling-group, routing priorities,
        user-supplied labels/annotations) lives under `config`. The
        materialised Pool's metadata + spec are server-internal state
        (captured after plugin admission ran) and are NOT exposed here — query
        the SandboxPool CR directly via `GET /v1/sandboxenvs/{name}/sandboxpools/{poolName}`
        to inspect the rendered Pool.
      properties:
        name:
          type: string
          description: "SandboxPool's metadata.name within the Env's namespace. Acts as the member identity within the Env."
        config:
          $ref: "#/components/schemas/EnvClusterMemberConfig"

    EnvClusterMemberConfig:
      type: object
      description: |
        User-declared intent for one Env member. Plugins do not mutate this —
        it stays equal to whatever the caller supplied at AddMember /
        UpdateMember time, so it remains a faithful description of the
        request shape across the member's lifetime.
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: "User-supplied SandboxPool metadata.labels (e.g. quota.scitix.ai/url). Plugins may consume these for routing decisions; their output lands on the server-internal member.metadata, not here."
        annotations:
          type: object
          additionalProperties:
            type: string
          description: "User-supplied SandboxPool metadata.annotations. Same propagation as labels."
        instanceType:
          type: string
          description: "Optional InstanceType catalog entry referenced by this member."
        multiplier:
          type: integer
          format: int32
          description: "Multiplier applied to the InstanceType base resources for this member."
        inlineResources:
          $ref: "#/components/schemas/ResourceRequirements"
          description: "Per-Pool resource sizing. When set, replaces containers[0].resources of the rendered Template. Use this (or InstanceType + Multiplier) to express resource regions across members. Kept around for Template-upgrade resource alignment via a future RefreshMember API."
        scalingGroup:
          type: string
          description: "ScalingGroup name (typically derived from the effective resources, e.g. '1c4Gi'). Members in the same group share autoscaling policy."
        minReplicas:
          type: integer
          format: int32
          description: "Lower bound on this member's spec.replicas. Enforced by the Env autoscaler as a per-member scale-down floor."
        maxReplicas:
          type: integer
          format: int32
          description: "Upper bound on this member's spec.replicas. Enforced by the Env autoscaler when distributing scale-up delta."
        priority:
          type: integer
          format: int32
          description: "Canonical preference: lower wins. Used for routing tiebreaks and as the default for scaleUpPriority / scaleDownPriority when those are unset."
        scaleUpPriority:
          type: integer
          format: int32
          description: "Scale-up order within the scaling group — lower scaled first. When omitted, falls back to priority. Same-value tiebreak by name."
        scaleDownPriority:
          type: integer
          format: int32
          description: "Scale-down order within the scaling group — lower shrunk first. When omitted, falls back to priority."
        updateStrategy:
          $ref: "#/components/schemas/EnvUpdateStrategy"
          description: "Per-member override of the Env-wide overrides.updateStrategy. Unset fields inherit from the Env default, then autoUpdate=true / maxUnavailable=20%."

    EnvUpdateStrategy:
      type: object
      description: "Automatic rollout policy for member Pools when their rendered idle-Pod identity (Template edit, image / networkPolicy override) changes. Rollout mode is always Recreate: stale idle Pods are rebuilt; claimed (Running/Starting) Pods are never disrupted and roll after returning to Idle."
      properties:
        autoUpdate:
          type: boolean
          description: "Whether the member auto-rolls when its revision changes. Resolution order: member → env → default true. Set false to freeze a member on its current revision."
        maxUnavailable:
          type: string
          description: "Rollout unavailability budget as an absolute count (\"3\") or a percentage of desired idle replicas (\"20%\"). Rounded down, floored at 1. Resolution order: member → env → default \"20%\"."

    ResourceRequirements:
      type: object
      description: "Subset of Kubernetes corev1.ResourceRequirements used for per-Pool resource sizing on EnvClusterMember.inlineResources."
      properties:
        requests:
          type: object
          description: "Resource requests keyed by resource name (e.g. cpu, memory). Values use Kubernetes Quantity strings, e.g. '500m', '1Gi'."
          additionalProperties:
            type: string
        limits:
          type: object
          description: "Resource limits keyed by resource name."
          additionalProperties:
            type: string

    EnvOverrides:
      type: object
      description: "SandboxTemplate fields this Env replaces uniformly for every member Pool. The Env represents a single class of sandbox runtime, so image, image policy, default timeouts and image-pull credentials are expected to be shared; per-Pool variation lives on each EnvClusterMember."
      properties:
        image:
          type: string
          description: "Override the main container (containers[0]) image of the rendered Template. Applied before any per-Member overrides."
        podCreationImagePolicy:
          type: string
          enum: [PoolDefaultImage, IdleImage]
          description: "Mirrored onto every member Pool's spec.podCreationImagePolicy."
        defaultStartupTimeout:
          type: string
          description: "Mirrored onto every member Pool's spec.defaultStartupTimeout. Duration string, e.g. '5m'."
        defaultIdleTimeout:
          type: string
          description: "Mirrored onto every member Pool's spec.defaultIdleTimeout. Duration string, e.g. '30m'."
        imagePullSecret:
          $ref: "#/components/schemas/ImagePullSecretInput"
          description: |
            Write-only image-pull credentials. On create / update the server materialises a
            dockerconfigjson Secret named `ips-{envName}` in the Env's namespace with an
            OwnerReference back to the Env (cascade-deleted by Kubernetes GC). At render
            time the Env Reconciler appends that Secret's reference to every member
            Pool's spec.template.spec.imagePullSecrets so the kubelet can pull private
            images uniformly across the Env. Not returned on GET — check
            imagePullSecretConfigured for read-state.
        imagePullSecretConfigured:
          type: boolean
          readOnly: true
          description: "Server-set on GET: true when the ips-{envName} Secret exists in the Env's namespace. Write attempts via PATCH are ignored."
        networkPolicy:
          $ref: "#/components/schemas/SandboxNetworkPolicy"
          description: |
            Egress network policy applied uniformly to every member Pool's sandbox
            Pods. When set, the operator injects a transparent egress-filter sidecar
            and enforces the policy (default-deny allowlist). Omit for unrestricted
            egress. Per-sandbox overrides are available via the E2B create body.
        updateStrategy:
          $ref: "#/components/schemas/EnvUpdateStrategy"
          description: "Env-wide default rollout policy for member Pools when their idle-Pod identity changes. Overridable per member via EnvClusterMemberConfig.updateStrategy."
      additionalProperties: false

    SandboxNetworkPolicy:
      type: object
      description: "Sandbox egress network policy, enforced by an in-Pod transparent proxy sidecar (supports domain matching, which the cluster CNIs cannot). Allowlist / default-deny semantics."
      properties:
        disableEgress:
          type: boolean
          description: "Block all outbound traffic (DNS still resolves). A quick 'no internet' switch; takes precedence over egress."
        egress:
          $ref: "#/components/schemas/EgressRules"
          description: "Allowlist. When disableEgress is false and egress is omitted, egress is unrestricted (subject to the anti-SSRF baseline)."
        allowPrivateNetworks:
          type: boolean
          description: "Disable the default deny of private / link-local / cloud-metadata ranges (RFC1918, 169.254.0.0/16, ...). Default false — the anti-SSRF baseline stays on."
      additionalProperties: false

    EgressRules:
      type: object
      description: "Allow/deny rules for sandbox outbound traffic."
      properties:
        allowedDomains:
          type: array
          items:
            type: string
          description: "Permit egress to matching hostnames. Exact ('pypi.org'), wildcard-all ('*'), or suffix ('*.pythonhosted.org'). Matched via TLS SNI (443) / HTTP Host (80)."
        allowedCIDRs:
          type: array
          items:
            type: string
          description: "Permit egress to these CIDR blocks / bare IPs (promoted to /32)."
        deniedCIDRs:
          type: array
          items:
            type: string
          description: "Block egress to these CIDR blocks / bare IPs. Domains are not supported for deny."
      additionalProperties: false

    EnvClusterSpec:
      type: object
      required: [clusterID]
      properties:
        clusterID:
          type: string
          description: "Cluster identifier that owns this segment. Each Worker only mutates the segment matching its own clusterID."
        members:
          type: array
          description: "Member Pools in this cluster. MVP allows multiple members per cluster but a single ScalingGroup."
          items:
            $ref: "#/components/schemas/EnvClusterMember"

    EnvAutoscalingGroup:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "ScalingGroup identifier this policy applies to. Matches the EnvClusterMember.scalingGroup of at least one member declared on the env — the group is created automatically when a member with this ScalingGroup is added, and garbage-collected by the Env reconciler once no member references it."
        enabled:
          type: boolean
          description: "Per-group master switch. When false, this group's members keep manual Pool replicas; the autoscaler skips it. Each group is independent — other groups continue to run if Enabled=true."
        minReplicas:
          type: integer
          format: int32
          minimum: 0
          description: "Lower bound on the group's aggregate desired replicas."
        maxReplicas:
          type: integer
          format: int32
          description: "Upper bound on the group's aggregate desired replicas."
        scaleUpPolicy:
          $ref: "#/components/schemas/PoolScaleUpPolicy"
        scaleDownPolicy:
          $ref: "#/components/schemas/PoolScaleDownPolicy"

    EnvAutoscalingSpec:
      type: object
      description: "Env-level autoscaler config. The master switch lives per-group on EnvAutoscalingGroup.enabled so groups can be toggled independently."
      properties:
        groups:
          type: array
          description: "Per-scaling-group policies. The autoscaler iterates Groups in order and operates on the first Enabled=true entry; future multi-group routing will use member.ScalingGroup to dispatch."
          items:
            $ref: "#/components/schemas/EnvAutoscalingGroup"

    SandboxEnvSpec:
      type: object
      required: [templateRef, mode]
      properties:
        templateRef:
          $ref: "#/components/schemas/SandboxEnvTemplateRef"
        mode:
          type: string
          enum: [WarmPool, OnDemandJob]
          description: "Routing mode — WarmPool dispatches to pre-warmed member Pools; OnDemandJob (Phase 3) creates a SandboxJob per request."
        defaults:
          $ref: "#/components/schemas/SandboxEnvDefaults"
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/EnvClusterSpec"
        autoscaling:
          $ref: "#/components/schemas/EnvAutoscalingSpec"
        overrides:
          $ref: "#/components/schemas/EnvOverrides"

    EnvObservedMember:
      type: object
      required: [name]
      properties:
        name:
          type: string
        instanceType:
          type: string
        multiplier:
          type: integer
          format: int32
        state:
          type: string
          enum: [Active, Saturated, Missing, Inconsistent]
        idleCount:
          type: integer
          format: int32
        runningCount:
          type: integer
          format: int32
        desiredReplicas:
          type: integer
          format: int32
        currentReplicas:
          type: integer
          format: int32
        pendingRequests:
          type: integer
          format: int32
          description: "Mirror of SandboxPool.status.pendingRequests for this member — throttled at the source so visible value lags actual queue depth by up to ~3s."
        saturatedUntil:
          type: string
          format: date-time
          description: "Read-only mirror of SandboxPool.status.autoscaling.saturatedUntil. Until this time, the router deprioritises the member because the per-Pool autoscaler reported the cluster cannot fit additional replicas."
        updateRevision:
          type: string
          description: "Mirror of the member Pool's status.updateRevision — the target revision the Pool is rolling towards."
        updatedReplicas:
          type: integer
          format: int32
          description: "Mirror of the member Pool's status.updatedReplicas. A rollout is in progress while this is below the member's replica count."

    EnvClusterStatus:
      type: object
      required: [clusterID]
      properties:
        clusterID:
          type: string
        isLocal:
          type: boolean
          description: "True on the Worker that owns this segment. Other segments arrive via Hub Sync (future)."
        observedMembers:
          type: array
          items:
            $ref: "#/components/schemas/EnvObservedMember"
        lastSnapshotTime:
          type: string
          format: date-time

    EnvScalingGroupStatus:
      type: object
      required: [name]
      properties:
        name:
          type: string
        totalIdle:
          type: integer
          format: int32
        totalRunning:
          type: integer
          format: int32
        totalDesired:
          type: integer
          format: int32

    EnvCondition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time

    SandboxEnvStatus:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/EnvCondition"
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/EnvClusterStatus"
        scalingGroups:
          type: array
          items:
            $ref: "#/components/schemas/EnvScalingGroupStatus"
        memberCount:
          type: integer
          format: int32
          description: "Total member Pools across all cluster segments (today: the local segment only). Exists because printer columns cannot evaluate the nested clusters[].members[] array."
        desiredReplicas:
          type: integer
          format: int32
          description: "Env-wide sum of every member Pool's desired replicas."
        runningReplicas:
          type: integer
          format: int32
          description: "Env-wide sum of every member Pool's running replicas."
        idleReplicas:
          type: integer
          format: int32
          description: "Env-wide sum of every member Pool's idle replicas."

    SandboxEnv:
      type: object
      required: [name, namespace, spec]
      properties:
        name:
          type: string
        namespace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        spec:
          $ref: "#/components/schemas/SandboxEnvSpec"
        status:
          $ref: "#/components/schemas/SandboxEnvStatus"
        team:
          type: string
        user:
          type: string
        createdAt:
          type: string
          format: date-time
        envDocs:
          type: string
          description: "Rendered Markdown documentation for this Env, sourced from the linked SandboxTemplate's agentbox.navix.sh/docs annotation. The substitutions ${AGBX_ENV_NAME}, ${AGBX_POOL_NAME} (renders the env name for backward compat), ${AGBX_CLUSTER_ID}, ${AGBX_API_KEY} are performed server-side before the response is returned. When the docs reference ${AGBX_API_KEY} but the caller has no key with a recoverable plaintext token, GetSandboxEnv returns 422 with errorCode API_KEY_REQUIRED."

    SandboxEnvEnvelope:
      type: object
      required: [env]
      properties:
        env:
          $ref: "#/components/schemas/SandboxEnv"

    SandboxEnvSummary:
      type: object
      description: "Lightweight summary returned by the List endpoint — omits the full spec (autoscaling policies, per-member config) and detailed per-member status. Fetch GET /envs/{name} for the complete SandboxEnv."
      required: [name]
      properties:
        name:
          type: string
          description: "Name of the SandboxEnv (RFC 1123 DNS label, unique within its namespace)."
        namespace:
          type: string
        team:
          type: string
        user:
          type: string
        createdAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the Env was created."
        templateName:
          type: string
          description: "The bound SandboxTemplate name (from spec.templateRef.name)."
        mode:
          type: string
          enum: [WarmPool, OnDemandJob]
          description: "How the Env satisfies sandbox-create requests."
        memberCount:
          type: integer
          format: int32
          description: "Total member Pools across all cluster segments."
        desiredReplicas:
          type: integer
          format: int32
          description: "Env-wide sum of every member Pool's desired replicas."
        runningReplicas:
          type: integer
          format: int32
          description: "Env-wide sum of every member Pool's running replicas."
        idleReplicas:
          type: integer
          format: int32
          description: "Env-wide sum of every member Pool's idle replicas."
        scalingGroupCount:
          type: integer
          format: int32
          description: "Total number of autoscaling groups declared on the Env."
        autoscalingEnabledGroupCount:
          type: integer
          format: int32
          description: "Number of autoscaling groups with enabled=true. There is no Env-level autoscaling switch; autoscaling is toggled per group."
        ready:
          type: boolean
          description: "True when the Env's Ready condition is True (all members Active)."

    ListSandboxEnvsResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SandboxEnvSummary"

    UpdateSandboxEnvRequest:
      type: object
      description: "Patch one or more editable Env shell fields. Omitted fields are left unchanged. Members are managed through `/envs/{name}/sandboxpools/*` and autoscaling through `/envs/{name}/autoscaling/*`."
      properties:
        overrides:
          $ref: "#/components/schemas/EnvOverrides"

    UpdateEnvAutoscalingGroupRequest:
      type: object
      description: "Patch one or more editable fields on an autoscaling group. Omitted fields are left unchanged. Policy objects are REPLACED wholesale when supplied — callers must echo back any fields they want to preserve."
      properties:
        enabled:
          type: boolean
          description: "Toggle this group's autoscaler. nil = leave unchanged."
        minReplicas:
          type: integer
          format: int32
          minimum: 0
        maxReplicas:
          type: integer
          format: int32
        scaleUpPolicy:
          $ref: "#/components/schemas/PoolScaleUpPolicy"
        scaleDownPolicy:
          $ref: "#/components/schemas/PoolScaleDownPolicy"

    EnvAutoscalingSpecEnvelope:
      type: object
      required: [spec]
      properties:
        spec:
          $ref: "#/components/schemas/EnvAutoscalingSpec"

    EnvAutoscalingGroupEnvelope:
      type: object
      required: [group]
      properties:
        group:
          $ref: "#/components/schemas/EnvAutoscalingGroup"

    ListEnvAutoscalingGroupsResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnvAutoscalingGroup"
        total:
          type: integer

    DeleteEnvAutoscalingGroupResult:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          description: "'Deleted' on success."

    CreateSandboxEnvRequest:
      type: object
      required: [name, templateRef]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          pattern: "^[a-z]([a-z0-9-]*[a-z0-9])?$"
          description: "RFC 1123 DNS label. Capped at 24 chars so derived names (PoolName = EnvName + ResourceKey + QuotaShort, PodName = PoolName + UUID) stay under the 63-char label/DNS limit."
        templateRef:
          $ref: "#/components/schemas/SandboxEnvTemplateRef"
        mode:
          type: string
          enum: [WarmPool, OnDemandJob]
          default: WarmPool
        overrides:
          $ref: "#/components/schemas/EnvOverrides"
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string

    DeleteSandboxEnvResult:
      type: object
      required: [name, namespace, status]
      properties:
        name:
          type: string
        namespace:
          type: string
        status:
          type: string
          description: "'Terminating' on a successful delete request."

    # =========================================================
    # SandboxTemplate
    # =========================================================
    RuntimeReadinessProbe:
      type: object
      description: "Lightweight readiness probe — only httpGet is supported. Advanced fields (initialDelaySeconds, periodSeconds, etc.) use Kubernetes defaults."
      properties:
        httpGet:
          type: object
          required: [port]
          properties:
            port:
              type: integer
              format: int32
              minimum: 1
              maximum: 65535
              description: "Port to probe"
            path:
              type: string
              description: "HTTP path to probe (e.g. /healthz), defaults to /"
          additionalProperties: false
      additionalProperties: false

    Runtime:
      type: object
      required: [name]
      properties:
        name:
          type: string
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
        description:
          type: string
          description: "Human-readable description of this runtime"
        logDir:
          type: string
          description: "Path to the runtime log file inside the container (e.g. /tmp/envd.log)"
        readinessProbe:
          $ref: "#/components/schemas/RuntimeReadinessProbe"
          description: "Optional readiness probe for this runtime endpoint"
      additionalProperties: false

    VisibilityRule:
      type: object
      properties:
        team:
          type: string
          description: "Team name that this rule applies to."
        users:
          type: array
          description: "Specific users within the team that this rule applies to. Empty means all users in the team."
          items:
            type: string
      additionalProperties: false

    VisibilityConfig:
      type: object
      properties:
        rules:
          type: array
          description: "List of visibility rules controlling which teams and users can see this template."
          items:
            $ref: "#/components/schemas/VisibilityRule"
      additionalProperties: false

    SandboxTemplateSpec:
      type: object
      properties:
        version:
          type: string
          description: 'User-defined version string for the template (e.g. "v1.2.3").'
        description:
          type: string
          description: "Human-readable description of the template and its intended use."
        idleImage:
          type: string
          description: "Container image used when the pod is in Idle phase (lightweight placeholder image)."
        template:
          type: string
          description: "Kubernetes PodTemplateSpec serialized as YAML/JSON string, passed through as-is"
        runtimes:
          type: array
          items:
            $ref: "#/components/schemas/Runtime"
          description: "Runtime port mappings for the sandbox"
        visibility:
          $ref: "#/components/schemas/VisibilityConfig"
          description: "Access visibility rules"

    SandboxTemplateStatus:
      type: object
      properties:
        ready:
          type: boolean
          description: "True when the template has been validated and is ready for use."
        message:
          type: string
          description: "Human-readable status message, populated when ready is false."

    SandboxTemplateSummary:
      type: object
      description: "Lightweight summary returned by the List endpoint — omits spec, specYaml, labels, annotations, status, and full docs to reduce payload size."
      required: [name]
      properties:
        name:
          type: string
          description: "Name of the SandboxTemplate cluster resource (RFC 1123 DNS label)."
        version:
          type: string
          description: "User-defined version of this template (from spec.version)."
        description:
          type: string
          description: "Human-readable description of the template (from spec.description)."
        createdAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the template was created."
        cpu:
          type: string
          description: 'CPU resource quantity derived from the template''s pod spec (e.g. "1", "100m").'
        memory:
          type: string
          description: 'Memory resource quantity derived from the template''s pod spec (e.g. "16Gi", "512Mi").'
        syncSource:
          type: string
          description: "Resource origin: 'global' (synced via ws-proxy) or 'local' (created directly on worker)."
        runtimeNames:
          type: array
          description: "List of runtime endpoint names defined in this template (lightweight alternative to the full Runtime objects)."
          items:
            type: string
        hasDocs:
          type: boolean
          description: "True when the template has documentation in the agentbox.navix.sh/docs annotation."

    SandboxTemplate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "Name of the SandboxTemplate cluster resource (RFC 1123 DNS label)."
        version:
          type: string
          description: "User-defined version of this template (from spec.version)."
        description:
          type: string
          description: "Human-readable description of the template (from spec.description)."
        createdAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the template was created."
        cpu:
          type: string
          description: 'CPU resource quantity derived from the template''s pod spec (e.g. "1", "100m").'
        memory:
          type: string
          description: 'Memory resource quantity derived from the template''s pod spec (e.g. "16Gi", "512Mi").'
        syncSource:
          type: string
          description: "Resource origin: 'global' (synced via ws-proxy) or 'local' (created directly on worker). Empty for legacy resources."
        docs:
          type: string
          description: "Markdown documentation for the template, stored in the agentbox.navix.sh/docs annotation. Supports variables ${AGBX_POOL_NAME}, ${AGBX_CLUSTER_ID}, ${AGBX_API_KEY} for pool-specific rendering. On Template Get the server substitutes them with human-readable hints (YOUR_POOL_NAME, real cluster ID, YOUR_API_KEY); on Pool Get they are substituted with real values."
        crdYaml:
          type: string
          description: "Complete raw SandboxTemplate CRD YAML (without managedFields). Includes resourceVersion and uid for optimistic locking on PUT."

    SandboxTemplateEnvelope:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/SandboxTemplate"

    UpsertSandboxTemplateRequest:
      type: object
      required: [crdJson]
      properties:
        crdJson:
          type: string
          description: "Complete SandboxTemplate CRD object serialized as JSON. metadata.name is required. Labels, annotations, and resourceVersion are extracted from the JSON."

    DeleteSandboxTemplateResult:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string

    ListSandboxTemplatesResult:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: "Page of SandboxTemplateSummary objects (lightweight — use GET /sandbox-templates/{name} for full details)."
          items:
            $ref: "#/components/schemas/SandboxTemplateSummary"
        total:
          type: integer
          description: "Total number of templates (before pagination)."
        limit:
          type: integer
          description: "Maximum number of items requested per page."
        offset:
          type: integer
          description: "Number of items skipped before this page."

    # =========================================================
    # APIKey
    # =========================================================
    SelfCreateAPIKeyRequest:
      type: object
      description: Request body for tenant self-service API key creation. Namespace/user/team are taken from the caller's auth context.
      properties:
        description:
          type: string
          description: "Optional human-readable description for this key (e.g. its intended use)."
        expiresAt:
          type: string
          format: date-time
          description: "Optional RFC 3339 expiry timestamp. Omit for a non-expiring key."

    CreateAPIKeyRequest:
      type: object
      properties:
        namespace:
          type: string
          description: "Kubernetes namespace to associate the key with."
        user:
          type: string
          description: "Username to associate the key with."
        team:
          type: string
          description: "Team name to associate the key with."
        description:
          type: string
          description: "Optional human-readable description for this key."
        expiresAt:
          type: string
          format: date-time
          description: "Optional RFC 3339 expiry timestamp. Omit for a non-expiring key."
        tokenHash:
          type: string
          description: >
            Full SHA-256 hex hash of the raw token (64 hex chars). When
            provided together with hashPrefix, the key is imported using the
            given hash instead of generating a new random token. The
            operation is idempotent — if a key with the same hash already
            exists it is silently accepted. Admin-only.
        hashPrefix:
          type: string
          description: >
            First 16 hex characters of the tokenHash. Required when
            tokenHash is provided.
        issuedAt:
          type: string
          format: date-time
          description: >
            Original issue timestamp (import mode). Used to preserve the
            original creation time. Ignored when tokenHash is not provided.

    CreateAPIKeyResult:
      type: object
      required: [apiKey, keyId, role, issuedAt]
      properties:
        apiKey:
          type: string
          description: "The raw API key value (only returned once at creation time; store it securely)."
        keyId:
          type: string
          description: "Unique identifier for this API key (used to look up or delete the key)."
        user:
          type: string
          description: "Username associated with the key."
        team:
          type: string
          description: "Team associated with the key."
        role:
          type: string
          description: "Role granted by this key (e.g. tenant, admin)."
        description:
          type: string
          description: "Human-readable description of the key."
        issuedAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the key was created."
        expiresAt:
          type: string
          format: date-time
          description: "RFC 3339 expiry timestamp, or absent if the key never expires."

    APIKeyItem:
      type: object
      required: [keyId, role, issuedAt]
      properties:
        keyId:
          type: string
          description: "Unique identifier for this API key."
        user:
          type: string
          description: "Username associated with the key."
        team:
          type: string
          description: "Team associated with the key."
        role:
          type: string
          description: "Role granted by this key (e.g. tenant, admin)."
        description:
          type: string
          description: "Human-readable description of the key."
        issuedAt:
          type: string
          format: date-time
          description: "RFC 3339 timestamp when the key was created."
        expiresAt:
          type: string
          format: date-time
          description: "RFC 3339 expiry timestamp, or absent if the key never expires."
        syncSource:
          type: string
          description: "Resource origin: 'global' (synced via ws-proxy) or 'local' (created directly on worker). Empty for legacy resources."
        rawToken:
          type: string
          description: >
            The full raw API key value (agbx_...), present only for keys created after plaintext
            storage was introduced. Absent for legacy keys. Displayed masked in UI; the full value
            is returned here for recovery by authorised callers.

    PromoteAPIKeyResult:
      type: object
      required: [keyId, status]
      properties:
        keyId:
          type: string
          description: "Unique identifier of the promoted API key."
        status:
          type: string
          description: "Result of the promote operation (e.g. Promoted)."

    DeleteAPIKeyResult:
      type: object
      required: [keyId, status]
      properties:
        keyId:
          type: string
          description: "Unique identifier of the deleted API key."
        status:
          type: string
          description: "Result of the delete operation (e.g. Deleted)."

    ListAPIKeysResult:
      type: array
      description: "List of API key objects. Returned in full — the endpoint does not paginate."
      items:
        $ref: "#/components/schemas/APIKeyItem"

    # =========================================================
    # Quota
    # =========================================================
    QuotaResources:
      type: object
      description: "Resource accounting for a single quota, keyed by resource name (e.g. cpu, memory, nvidia.com/gpu, sci.c22-2)."
      properties:
        total:
          type: object
          description: "Total capacity allocated to this quota."
          additionalProperties:
            type: string
        used:
          type: object
          description: "Currently consumed amount."
          additionalProperties:
            type: string
        reserved:
          type: object
          description: "Reserved but not yet actively consumed amount."
          additionalProperties:
            type: string
        free:
          type: object
          description: "Available amount (total - used - reserved)."
          additionalProperties:
            type: string

    Quota:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: "Stable identifier for this quota. Used by clients to reference the quota in subsequent API calls (e.g. as the reservation target). Opaque from the caller's perspective."
        name:
          type: string
          description: "Human-readable display name for this quota. Suitable for showing in UI; not guaranteed to be unique across providers."
        team:
          type: string
          description: "Team that owns this quota, if applicable."
        user:
          type: string
          description: "User that owns this quota, if applicable."
        resources:
          $ref: "#/components/schemas/QuotaResources"
        metadata:
          type: object
          description: "Provider-attached display hints, opaque to the core schema. Keys are provider-defined (e.g. a vendor-prefixed pool name/type); generic clients ignore unknown keys."
          additionalProperties:
            type: string

    ListQuotasResult:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: "Page of quota objects."
          items:
            $ref: "#/components/schemas/Quota"
        total:
          type: integer
          description: "Total number of quota entries (before pagination)."
        limit:
          type: integer
          description: "Maximum number of items requested per page."
        offset:
          type: integer
          description: "Number of items skipped before this page."

    # =========================================================
    # WhoAmI
    # =========================================================
    WhoAmIResult:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: "Role assigned to the caller's API key (e.g. tenant, admin)."
        user:
          type: string
          description: "Username extracted from the caller's auth context."
        team:
          type: string
          description: "Team extracted from the caller's auth context."

    # =========================================================
    # FeatureGates
    # =========================================================
    FeatureGates:
      type: object
      required: [quota, instanceType]
      description: >-
        Boolean switches that tell clients which optional features are wired
        into the current deployment. Dashboards gate feature UI on these
        values; SDKs can short-circuit feature-specific calls when a gate is
        false.
      properties:
        quota:
          type: boolean
          description: >-
            True when a non-noop quota provider is active (quota selection on
            pool creation, quota listing endpoint). False on deployments with
            no quota backend wired in.
          example: true
        instanceType:
          type: boolean
          description: >-
            True when a non-noop InstanceType catalog provider is active
            (catalog-driven member sizing in the Env upsert sheet,
            `/instancetypes` listing endpoint). False on deployments with no
            InstanceType backend wired in.
          example: true

    # =========================================================
    # InstanceType catalog
    # =========================================================
    InstanceTypeItem:
      type: object
      required: [name, baseResources]
      description: >-
        Catalog entry exposing a named base resource shape. Sandboxes pick an
        entry by `name` and a positive integer multiplier; resolution to Pod
        resources happens server-side.
      properties:
        name:
          type: string
          description: "Catalog key. Unique within a deployment."
        showName:
          type: string
          description: "User-facing label. Falls back to `name` when empty."
        description:
          type: string
          description: "Free-form description for tooltips."
        baseResources:
          $ref: "#/components/schemas/ResourceRequirements"
          description: "Pod resource requirements at multiplier=1. Numeric keys (cpu, memory, nvidia.com/gpu, ...) scale linearly with the multiplier."
        maxMultiplier:
          type: integer
          format: int32
          minimum: 0
          description: "Maximum allowed multiplier. 0 means no cap."
        cost:
          type: string
          description: "Free-form cost weight for client-side sorting / display."
        extensions:
          type: object
          additionalProperties:
            type: string
          description: "Backend-specific key/value pairs (e.g. `gpu-type`). Open clients pass these through unchanged for display only."

    ListInstanceTypesResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: "Available InstanceType entries, sorted by name."
          items:
            $ref: "#/components/schemas/InstanceTypeItem"
        total:
          type: integer
          description: "Number of returned entries."

    # =========================================================
    # Organization
    # =========================================================
    TeamsResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: "List of team names."
          items:
            type: string
        total:
          type: integer
          description: "Total number of teams."

    UsersResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: "List of usernames in the team."
          items:
            type: string
        total:
          type: integer
          description: "Total number of users in the team."

    NamespacesResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: "List of Kubernetes namespace names."
          items:
            type: string
        total:
          type: integer
          description: "Total number of namespaces."

    # =========================================================
    # Statistics
    # =========================================================
    SandboxStatistics:
      type: object
      required: [total, byStatus, byNamespace]
      properties:
        total:
          type: integer
          description: "Total number of sandboxes across all namespaces."
        byStatus:
          type: object
          description: "Sandbox count broken down by status (e.g. Running, Failed)."
          additionalProperties:
            type: integer
        byNamespace:
          type: object
          description: "Sandbox count broken down by Kubernetes namespace."
          additionalProperties:
            type: integer

    SandboxStatisticsEnvelope:
      type: object
      required: [statistics]
      properties:
        statistics:
          $ref: "#/components/schemas/SandboxStatistics"

    UserSandboxStatistics:
      type: object
      required: [namespace, total, byStatus]
      properties:
        namespace:
          type: string
          description: "Kubernetes namespace these statistics are scoped to."
        total:
          type: integer
          description: "Total number of sandboxes in the user's namespace."
        byStatus:
          type: object
          description: "Sandbox count broken down by status (e.g. Running, Failed)."
          additionalProperties:
            type: integer

    UserSandboxStatisticsEnvelope:
      type: object
      required: [statistics]
      properties:
        statistics:
          $ref: "#/components/schemas/UserSandboxStatistics"

    # =========================================================
    # Errors
    # =========================================================
    ClusterSummary:
      type: object
      required: [id, local]
      description: "One cluster entry visible through the gateway's routing table."
      properties:
        id:
          type: string
          description: |
            Cluster identifier. Use this value as the prefix when addressing
            cross-cluster resources: `{id}.{uuid}` for sandboxes,
            `{id}::{poolName}` for pools.
          example: "cluster1"
        name:
          type: string
          description: "Human-readable display name (may equal id)."
          example: "cluster1"
        local:
          type: boolean
          description: |
            True when this entry is the cluster serving the current request —
            i.e. sandbox/pool identifiers without any cross-cluster prefix refer
            to this cluster.
          example: true

    ListClustersResult:
      type: object
      required: [clusters]
      description: "Response envelope for `GET /clusters`."
      properties:
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/ClusterSummary"

    ErrorResponse:
      type: object
      required: [error]
      description: |
        Standard error envelope. Individual endpoints override the `example` per response
        code so the shape of `detail` is accurate for that specific failure mode.
      properties:
        error:
          type: string
          description: "Human-readable error message."
        errorCode:
          type: string
          description: |
            Machine-readable business error code. Only present for specific business errors
            that require special handling (e.g. `API_KEY_REQUIRED` prompts the client to
            call `POST /api-keys` before retrying). Generic HTTP errors (400, 500, etc.) do
            NOT carry this field.
          example: "API_KEY_REQUIRED"
        detail:
          description: |
            Structured context for the error. Shape depends on the failure mode. Common
            variants:
              * Plain string — simple context ("pool not found: my-pool")
              * `PoolStatusDetail` — returned on 409/429 from CreateSandbox to describe
                pool replica breakdown and retry hints
              * `{availablePools: [...]}` — returned on 404 from CreateSandbox / 400 from
                CreateSandboxPool when the referenced resource does not exist
              * `{availableTemplates: [...]}` — returned on 400 from CreateSandboxPool
              * `{availableQuotaURLs: [...]}` — returned on 400 when spec.reservation is
                set but quotaURL is missing

paths:
  # =========================================================
  # Auth
  # =========================================================
  /auth/whoami:
    get:
      operationId: GetWhoAmI
      summary: Get caller identity
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmIResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================================================
  # Sandboxes
  # =========================================================
  /sandboxes:
    post:
      operationId: CreateSandbox
      summary: Create a sandbox
      tags: [sandboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnvelope"
              example:
                sandbox:
                  sandboxId: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
                  namespace: "t-team1-user1"
                  poolName: "my-pool"
                  podName: "my-pool-xy7k2"
                  status: "Running"
                  claimedAt: "2026-04-21T10:15:30Z"
                  team: "team1"
                  user: "user1"
        "400":
          description: Bad Request — validation failure (e.g. missing `poolName`, invalid `idleTimeout`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "poolName is required"
        "401":
          description: Unauthorized — API key missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid API key"
        "404":
          description: |
            Not Found — the requested `poolName` does not exist in the caller's namespace.
            The `detail` field carries an `availablePools` array so the client can pick a
            valid pool without a second round-trip to `ListSandboxPools`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sandbox pool t-team1-user1/missing-pool not found"
                detail:
                  availablePools:
                    - name: "my-pool"
                      namespace: "t-team1-user1"
                      idle: 2
                      running: 1
                      starting: 0
                    - name: "gpu-pool"
                      namespace: "t-team1-user1"
                      idle: 0
                      running: 0
                      starting: 1
                  hint: "Pool not found. Pick a name from availablePools, or call POST /v1/sandboxpools first."
        "409":
          description: |
            Conflict — the target pool has no idle pods. `detail` is a `PoolStatusDetail`
            exposing the live replica counts and a human-readable hint so the client can
            either retry after `retryAfter` or scale the pool up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "no idle pods available in pool my-pool"
                detail:
                  idle: 0
                  running: 3
                  starting: 0
                  stopping: 0
                  failed: 0
                  hint: "pool at capacity; wait for a running sandbox to be released or scale up"
        "429":
          description: |
            Too Many Requests — SI Scheduler rejected the reservation attempt.
            `detail` mirrors the scheduler's submit response (`errCode`, optional `retryAfter`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "scale failed: QUOTA_EXCEEDED"
                detail:
                  errCode: "QUOTA_EXCEEDED"
                  message: "user quota reached its hard cap"
                  retryAfter: 30
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "failed to generate sandbox UUID"
    get:
      operationId: ListSandboxes
      summary: List sandboxes
      tags: [sandboxes]
      parameters:
        - $ref: "#/components/parameters/QueryPoolName"
        - $ref: "#/components/parameters/QuerySandboxStatus"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSandboxesResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxId}:
    get:
      operationId: GetSandbox
      summary: Get a sandbox
      tags: [sandboxes]
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnvelope"
              example:
                sandbox:
                  sandboxId: "5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
                  namespace: "t-team1-user1"
                  poolName: "my-pool"
                  podName: "my-pool-xy7k2"
                  status: "Running"
                  claimedAt: "2026-04-21T10:15:30Z"
                  team: "team1"
                  user: "user1"
                  endpoints:
                    default: "https://agentbox.example.com/v1/sandboxes/5de15c92-8fb5-440f-a9ea-7f62f734f1b9"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid API key"
        "404":
          description: Not Found — the sandbox does not exist or has already been terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sandbox t-team1-user1/5de15c92-8fb5-440f-a9ea-7f62f734f1b9 not found or already terminated"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: DeleteSandbox
      summary: Delete a sandbox
      tags: [sandboxes]
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSandboxResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxId}/timeout:
    put:
      summary: Update sandbox idle timeout
      operationId: SetSandboxTimeout
      tags: [sandboxes]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSandboxTimeoutRequest"
      responses:
        "204":
          description: Timeout updated
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxId}/logs:
    get:
      operationId: GetSandboxLogs
      summary: Get sandbox logs
      tags: [sandboxes]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
        - name: container
          in: query
          required: false
          schema:
            type: string
          description: "Filter by container name. When omitted, logs from all containers are returned."
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          description: "Return only the last N lines. 0 or absent means return all lines."
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: |
            Log source selector.
            - Omit or "stdout": return container stdout/stderr (default behavior)
            - "<runtime_name>": read the runtime's log file (logDir) via exec inside the container.
              Only available for Running sandboxes with a matching runtime that has logDir set.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxLogsResult"
        "400":
          description: Bad Request (e.g. runtime not found, logDir not configured, sandbox not Running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxId}/exec-token:
    post:
      operationId: CreateSandboxExecToken
      summary: Create a short-lived exec token for WebSocket terminal
      description: |
        Returns a single-use token (TTL 30s) for establishing a WebSocket terminal.
        WS endpoint: wss://<host>/ws/clusters/{clusterID}/sandboxes/{sandboxId}/terminal?token=<token>
        The sandbox must be in Running phase.
      tags: [sandboxes]
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecTokenResponse"
        "400":
          description: Bad Request (sandbox not Running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxId}/is_ready:
    get:
      operationId: IsSandboxReady
      summary: Check if all runtime endpoints of a sandbox are ready
      deprecated: true
      description: |
        **DEPRECATED** — will be removed in a future version.

        Prefer `GET /sandboxes/{sandboxId}` and inspect the returned `sandbox.status`
        (`Running`) plus `sandbox.endpoints` (non-empty, correct scheme/port) instead.

        Executes the configured ReadinessProbe for each runtime endpoint and returns
        the aggregated result. Returns 200 when all probes pass, 503 when one or more
        probes fail. If a runtime has no ReadinessProbe configured, it is considered ready.
      tags: [sandboxes]
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
      responses:
        "200":
          description: All configured readiness probes passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxReadinessResult"
        "503":
          description: One or more endpoints are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxReadinessResult"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxId}/exec:
    post:
      operationId: ExecSandboxCommand
      summary: Execute a command inside a sandbox
      deprecated: true
      description: |
        **DEPRECATED** — will be removed in a future version.

        Prefer opening an interactive exec session with the WebSocket endpoint
        (see `POST /sandboxes/{sandboxId}/exec-token` + `wss://.../terminal`) for
        any non-trivial command execution. This REST call is limited to 300 seconds
        and does not stream output incrementally.

        Executes a shell command inside the sandbox and returns stdout, stderr, and exit code.
        The sandbox must be in Running phase. The command runs in a non-interactive shell (no TTY).
      tags: [sandboxes]
      parameters:
        - $ref: "#/components/parameters/PathSandboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecCommandRequest"
      responses:
        "200":
          description: Command executed (check exitCode for success/failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecCommandResult"
        "400":
          description: Bad Request (sandbox not Running or invalid request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================================================
  # SandboxEnvs
  # =========================================================
  /envs:
    get:
      operationId: ListSandboxEnvs
      summary: List SandboxEnvs visible to the caller
      tags: [sandbox-envs]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSandboxEnvsResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: CreateSandboxEnv
      summary: Create a new SandboxEnv shell. Members are added through `POST /envs/{name}/sandboxpools`; the matching autoscaling group is created automatically per member and tuned through `PUT /envs/{name}/autoscaling/groups/{groupName}`.
      tags: [sandbox-envs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxEnvRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnvEnvelope"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already Exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /envs/{name}:
    get:
      operationId: GetSandboxEnv
      summary: Get a SandboxEnv by name. Response includes the rendered envDocs Markdown.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnvEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Entity (e.g. docs reference ${AGBX_API_KEY} but caller has no key with a recoverable plaintext token; errorCode = API_KEY_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: DeleteSandboxEnv
      summary: Delete a SandboxEnv. All member SandboxPools are cascade-deleted via OwnerReferences.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSandboxEnvResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: UpdateSandboxEnv
      summary: Update the editable Env shell fields (overrides only). Members and autoscaling groups have dedicated endpoints.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSandboxEnvRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnvEnvelope"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================================================
  # Env-scoped autoscaler config
  # The autoscaler config lives on SandboxEnv.spec.autoscaling. CRUD
  # here mutates that subtree. Groups are independent records keyed by
  # name (mirroring EnvClusterMember CRUD under /sandboxpools).
  # =========================================================
  /envs/{name}/autoscaling:
    get:
      operationId: GetEnvAutoscaling
      summary: Return the env's full autoscaling spec (enabled flag + groups).
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvAutoscalingSpecEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Env Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /envs/{name}/autoscaling/groups:
    get:
      operationId: ListEnvAutoscalingGroups
      summary: List autoscaling groups on the env.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvAutoscalingGroupsResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Env Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /envs/{name}/autoscaling/groups/{groupName}:
    get:
      operationId: GetEnvAutoscalingGroup
      summary: Get one autoscaling group by name.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: groupName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvAutoscalingGroupEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: UpdateEnvAutoscalingGroup
      summary: Patch one or more editable fields on an autoscaling group.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: groupName
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvAutoscalingGroupRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvAutoscalingGroupEnvelope"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: DeleteEnvAutoscalingGroup
      summary: Remove an autoscaling group from the env.
      tags: [sandbox-envs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: groupName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvAutoscalingGroupResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =========================================================
  # Env-scoped SandboxPools
  # Every "Pool" is a member of a SandboxEnv. CRUD here mutates
  # SandboxEnv.spec.clusters[].members[]; the Env Reconciler then
  # materialises the underlying SandboxPool CR (OwnerRef → Env).
  # =========================================================
  /envs/{name}/sandboxpools:
    post:
      operationId: CreateEnvSandboxPool
      summary: Add a member SandboxPool to an Env
      tags: [pools]
      parameters:
        - in: path
          name: name
