{{- if .Values.extproc.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-gateway-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.extproc.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.extproc.ingress.className }}
  rules:
    - host: {{ .Values.extproc.ingress.host }}
      http:
        paths:
          - path: /agent-sandbox/api/native(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-sandbox-api
                port:
                  number: 80
          - path: /agent-sandbox/api/data(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-sandbox-data-plane
                port:
                  number: 80
          - path: /agent-sandbox/api/e2b(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-sandbox-e2b-api
                port:
                  number: 80
{{- end }}
