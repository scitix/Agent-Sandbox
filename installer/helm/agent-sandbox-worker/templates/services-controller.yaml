---
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-sandbox-worker.controllerSelectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 80
      protocol: TCP
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-sandbox-worker.controllerSelectorLabels" . | nindent 4 }}
  ports:
    - name: http-metrics
      port: 8082
      protocol: TCP
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-e2b-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-sandbox-worker.controllerSelectorLabels" . | nindent 4 }}
  ports:
    - name: e2b-api
      port: 80
      protocol: TCP
      targetPort: e2b-api
