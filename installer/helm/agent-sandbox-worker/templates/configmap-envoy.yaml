apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-envoy-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8092
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    stream_idle_timeout: 3600s
                    request_timeout: 3600s
                    upgrade_configs:
                      - upgrade_type: websocket
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc_cluster
                            timeout: 10s
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SKIP
                            request_body_mode: NONE
                            response_body_mode: NONE
                            request_trailer_mode: SKIP
                            response_trailer_mode: SKIP
                          mutation_rules:
                            allow_envoy: true
                            allow_all_routing: true
                          failure_mode_allow: false
                          message_timeout: 10s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: sandbox_service
                          domains: ["*"]
                          routes:
                            # Cross-cluster TLS route: x-agentbox-cross-cluster=true AND scheme=https
                            - match:
                                prefix: "/"
                                headers:
                                  - name: x-agentbox-cross-cluster
                                    string_match:
                                      exact: "true"
                                  - name: x-agentbox-cluster-scheme
                                    string_match:
                                      exact: "https"
                              route:
                                cluster: cross_cluster_gateway_tls
                                timeout: 3600s
                                upgrade_configs:
                                  - upgrade_type: websocket
                              request_headers_to_remove:
                                - x-agentbox-cross-cluster
                                - x-agentbox-cluster-scheme
                            # Cross-cluster plain HTTP route: x-agentbox-cross-cluster=true AND scheme=http
                            - match:
                                prefix: "/"
                                headers:
                                  - name: x-agentbox-cross-cluster
                                    string_match:
                                      exact: "true"
                                  - name: x-agentbox-cluster-scheme
                                    string_match:
                                      exact: "http"
                              route:
                                cluster: cross_cluster_gateway_plain
                                timeout: 3600s
                                upgrade_configs:
                                  - upgrade_type: websocket
                              request_headers_to_remove:
                                - x-agentbox-cross-cluster
                                - x-agentbox-cluster-scheme
                            - match:
                                prefix: "/"
                              route:
                                cluster: original_dst_cluster
                                timeout: 3600s
                                upgrade_configs:
                                  - upgrade_type: websocket

      clusters:
        - name: ext_proc_cluster
          type: STATIC
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: ext_proc_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9002
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}

        - name: original_dst_cluster
          type: ORIGINAL_DST
          connect_timeout: 30s
          lb_policy: CLUSTER_PROVIDED
          upstream_connection_options:
            tcp_keepalive:
              keepalive_probes: 3
              keepalive_time: 60
              keepalive_interval: 30
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-envoy-original-dst-host

        - name: cross_cluster_gateway_tls
          type: ORIGINAL_DST
          connect_timeout: 10s
          lb_policy: CLUSTER_PROVIDED
          upstream_connection_options:
            tcp_keepalive:
              keepalive_probes: 3
              keepalive_time: 60
              keepalive_interval: 30
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-agentbox-upstream-host
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              upstream_http_protocol_options:
                auto_sni: true
              explicit_http_config:
                http_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                validation_context:
                  trust_chain_verification: ACCEPT_UNTRUSTED

        - name: cross_cluster_gateway_plain
          type: ORIGINAL_DST
          connect_timeout: 10s
          lb_policy: CLUSTER_PROVIDED
          upstream_connection_options:
            tcp_keepalive:
              keepalive_probes: 3
              keepalive_time: 60
              keepalive_interval: 30
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-agentbox-upstream-host
