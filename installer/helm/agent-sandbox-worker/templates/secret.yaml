{{- if not .Values.controller.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-admin-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENTBOX_ADMIN_KEY: {{ .Values.controller.secrets.adminKey | quote }}
  AGENTBOX_SECRET: {{ .Values.controller.secrets.secret | quote }}
  {{- with .Values.controller.observability.token }}
  # One token for both observability backends; kept out of the Deployment's
  # args so it does not appear in the Pod spec or in `ps` output.
  OBSERVABILITY_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
