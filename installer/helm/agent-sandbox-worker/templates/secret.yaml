{{- if not .Values.controller.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-admin-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENTBOX_ADMIN_KEY: {{ .Values.controller.secrets.adminKey | quote }}
  AGENTBOX_SECRET: {{ .Values.controller.secrets.secret | quote }}
{{- end }}
