{{- if .Values.extproc.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-dataplane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.extproc.gateway.name }}
      namespace: {{ .Values.extproc.gateway.namespace }}
  hostnames:
    - {{ .Values.extproc.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /agent-sandbox/api/native
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "agent-sandbox-worker.apiServiceName" . }}
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /agent-sandbox/api/data
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "agent-sandbox-worker.dataplaneServiceName" . }}
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /agent-sandbox/api/e2b
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "agent-sandbox-worker.e2bServiceName" . }}
          port: 80
---
# SecurityPolicy: Replaces nginx cors-allow-* annotations
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-dataplane-cors
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "agent-sandbox-worker.fullname" . }}-dataplane
  cors:
    allowOrigins:
      - type: RegularExpression
        value: ".*"
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - Authorization
      - Content-Type
      - X-AgentBox-Client-Version
      - AGENTBOX-API-KEY
    maxAge: 86400
---
# BackendTrafficPolicy: Replaces nginx proxy-{connect,read,send}-timeout annotations
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-dataplane-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "agent-sandbox-worker.fullname" . }}-dataplane
  timeout:
    http:
      requestTimeout: {{ .Values.extproc.gateway.timeouts.request | default "3600s" }}
---
# ClientTrafficPolicy: Replaces nginx proxy-body-size: 1024m annotation
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-dataplane-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.extproc.gateway.name }}
      namespace: {{ .Values.extproc.gateway.namespace }}
  http:
    maxRequestBodyBytes: 1073741824
{{- end }}
