{{- if .Values.controller.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.controller.gateway.name }}
      namespace: {{ .Values.controller.gateway.namespace }}
  hostnames:
    - {{ .Values.controller.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "agent-sandbox-worker.fullname" . }}-control-plane
          port: 80
---
# BackendTrafficPolicy: Replaces nginx proxy-{connect,read,send}-timeout annotations
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "agent-sandbox-worker.fullname" . }}-apiserver-timeouts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "agent-sandbox-worker.fullname" . }}-apiserver
  timeout:
    http:
      requestTimeout: {{ .Values.controller.gateway.timeouts.request | default "3600s" }}
{{- end }}
