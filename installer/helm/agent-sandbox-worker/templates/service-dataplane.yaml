apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox-worker.dataplaneServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
    {{- include "agent-sandbox-worker.extprocSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-sandbox-worker.extprocSelectorLabels" . | nindent 4 }}
  ports:
    - name: data-plane
      port: 80
      protocol: TCP
      targetPort: data-plane
    - name: envoy-admin
      port: 9901
      protocol: TCP
      targetPort: envoy-admin
    - name: internal-api
      port: 9003
      protocol: TCP
      targetPort: internal-api
