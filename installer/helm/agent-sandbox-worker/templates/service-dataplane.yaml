apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox-worker.dataplaneServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
    {{- include "agent-sandbox-worker.extprocSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-sandbox-worker.extprocSelectorLabels" . | nindent 4 }}
  ports:
    - name: data-plane
      port: 80
      protocol: TCP
      targetPort: data-plane
    - name: envoy-admin
      port: 9901
      protocol: TCP
      targetPort: envoy-admin
    # The extproc manager's own metrics: the activity-flush counters the rate
    # limit has to be sized against, and the queue-age ratio that says when a
    # limit is too tight. Scraped by the extproc ServiceMonitor.
    - name: metrics
      port: 8083
      protocol: TCP
      targetPort: metrics
