{{- if .Values.metrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ default (printf "%s-controller-metrics-monitor" (include "agent-sandbox-worker.fullname" .)) .Values.metrics.controllerMonitorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
    {{- include "agent-sandbox-worker.controllerSelectorLabels" . | nindent 4 }}
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: http-metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "agent-sandbox-worker.controllerSelectorLabels" . | nindent 6 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ default (printf "%s-extproc-metrics-monitor" (include "agent-sandbox-worker.fullname" .)) .Values.metrics.extprocMonitorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-worker.labels" . | nindent 4 }}
    {{- include "agent-sandbox-worker.extprocSelectorLabels" . | nindent 4 }}
spec:
  endpoints:
    - interval: 5s
      path: /stats/prometheus
      port: envoy-admin
      scheme: http
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "agent-sandbox-worker.extprocSelectorLabels" . | nindent 6 }}
{{- end }}
