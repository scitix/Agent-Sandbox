# ---------------------------------------------------------------------------
# CRD installation
# ---------------------------------------------------------------------------
# The chart ships CRDs under templates/crds/ so `helm upgrade` keeps their
# schemas in sync. The CRDs carry `helm.sh/resource-policy: keep`, so they
# survive `helm uninstall` and your CRs are never garbage-collected.
#
# Disable when CRDs are managed out-of-band — for example, when the
# agent-sandbox-hub chart already installs sandboxtemplates.agents.navix.sh
# in the same cluster, or when your platform provisions CRDs separately.
crds:
  create: true

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
# By default we assume the Helm release's --namespace is created out-of-band
# (or `helm install --create-namespace`). Set namespace.create to true if you
# want the chart to ship a Namespace resource — useful when generating a
# single-file installer applied via `kubectl apply -f`.
namespace:
  create: false

# ---------------------------------------------------------------------------
# Optional ConfigMap: extensions
# ---------------------------------------------------------------------------
# Renders the agentbox-extensions-config ConfigMap consumed by the controller's
# --extension-config flag. Disabled by default — most users mount this from a
# separate, hand-managed ConfigMap.
extensionsConfig:
  create: false
  # name defaults to "<fullname>-extensions-config" when empty.
  name: ""
  # content is the verbatim body of the extensions.yaml entry. Indented by 4
  # spaces inside the ConfigMap. Empty means an empty extensions.yaml.
  content: ""

# ---------------------------------------------------------------------------
# Controller (sandbox operator + API server)
# ---------------------------------------------------------------------------
controller:
  # egressProxyImage is the image carrying the egress-proxy binary. The egress
  # network-policy plugin injects it as the filter sidecar + init container into
  # sandbox Pods of Pools whose networkPolicy is set. Empty disables the flag —
  # such a Pool then fails pod creation (fail-closed). Set to the idle image,
  # which bundles egress-proxy.
  egressProxyImage: ""

  # appName is the value placed in app.kubernetes.io/name for the controller
  # Deployment + its Services + ServiceMonitor. Empty means "use the chart
  # name" (current behavior). Override when migrating from a non-Helm install
  # whose existing Deployment selector is pinned to a different value
  # (Deployment.spec.selector is immutable, so this must match exactly).
  appName: ""

  image:
    repository: ghcr.io/scitix/agent-sandbox-controller
    tag: latest
    pullPolicy: IfNotPresent

  # LOCAL_CLUSTER_ID uniquely identifies this worker cluster in a multi-cluster
  # setup. Must match the cluster id configured in the dashboard's
  # clusters.yaml. REQUIRED — env-scoped Pool ops (POST /v1/envs/{name}/sandboxpools
  # etc.) return 503 server-misconfigured when this is empty, and the env
  # member reconciler cannot place Pools on a cluster segment without it.
  localClusterId: ""

  # extprocInternalApiUrl is the gRPC endpoint of the data-plane extproc manager.
  # Defaults to the in-cluster service created by this chart.
  extprocInternalApiUrl: ""

  # envoyGatewayBaseUrl is the HTTP base URL of the data-plane Envoy proxy.
  # Defaults to the in-cluster service created by this chart.
  envoyGatewayBaseUrl: ""

  # e2bDomain is the hostname used for E2B-compatible API responses.
  # Defaults to the in-cluster data-plane service hostname.
  e2bDomain: ""

  # Service names exposed by the controller. Defaults are the historical names
  # since the chart's inception; existing installs keep working unchanged.
  # Override only when your environment needs a different name (e.g. to avoid a
  # collision, or to align with org naming conventions). Hub clusters[].url and
  # SDK env vars (E2B_DOMAIN / E2B_API_URL) reference these names externally —
  # if you change them, repoint those consumers too.
  services:
    apiName: ""        # default: agent-sandbox-api
    metricsName: ""    # default: agent-sandbox-controller-metrics
    e2bName: ""        # default: agent-sandbox-e2b-api

  # Secrets for the controller
  secrets:
    # adminKey is used to authenticate admin-level API operations.
    adminKey: ""
    # secret is the shared secret used for ws-proxy /v1/ws/sync auth AND for
    # verifying BFF-issued JWTs (HS256). The hub's env.secret must match this.
    secret: ""
    # existingSecret references a pre-existing Secret with keys:
    #   AGENTBOX_ADMIN_KEY, AGENTBOX_SECRET
    # When set, the chart does NOT create a new Secret.
    existingSecret: ""

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 2Gi

  nodeAffinity: {}
  tolerations: []

  # rbac.extraRules appends rules to the controller's manager ClusterRole.
  # Use this when an enabled extension (provider/plugin in
  # extensionsConfig.content) needs to watch a CRD that is not part of the
  # core chart — e.g. a quota provider that lists a vendor-specific
  # ScitixQuota CRD. Each entry follows the standard rbac.authorization.k8s.io
  # PolicyRule schema (apiGroups / resources / verbs / [resourceNames]).
  rbac:
    extraRules: []

# ---------------------------------------------------------------------------
# ExtProc (Envoy External Processor + data-plane manager)
# ---------------------------------------------------------------------------
extproc:
  # appName is the value placed in app.kubernetes.io/name for the extproc
  # Deployment + data-plane Service + extproc ServiceMonitor. Empty means
  # "<controller appName>-extproc" (current behavior). Same migration caveat
  # as controller.appName: matching the existing selector is mandatory.
  appName: ""

  image:
    repository: ghcr.io/scitix/agent-sandbox-envoyextproc
    tag: latest
    pullPolicy: IfNotPresent

  envoy:
    image:
      repository: envoyproxy/envoy
      tag: v1.37.0
      pullPolicy: IfNotPresent

  # Service name exposed by the data-plane (extproc + Envoy). Default is the
  # historical name; override semantics match controller.services above.
  services:
    dataPlaneName: ""  # default: agent-sandbox-data-plane

  resources:
    manager:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 2Gi
    envoy:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

  nodeAffinity: {}
  tolerations: []

  # Ingress for the data-plane (recommended external entry point).
  # Exposes three sub-paths:
  #   /agent-sandbox/api/native  → controller API server (port 80)
  #   /agent-sandbox/api/data    → extproc data-plane (port 80)
  #   /agent-sandbox/api/e2b     → E2B-compatible API (port 80)
  ingress:
    enabled: true
    # name overrides the Ingress resource name. Empty = "<fullname>-gateway-ingress".
    # Override when adopting an existing Ingress (rename would orphan the old one).
    name: ""
    className: nginx
    host: agent-sandbox-gateway.example.com
    annotations:
      nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
      nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-AgentBox-Client-Version, AGENTBOX-API-KEY"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: 1024m
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

  # Gateway API alternative to ingress (use with Envoy Gateway or similar).
  # Mutually exclusive with ingress; enable one or the other.
  # Replaces ALL nginx annotations above via native EG CRDs (SecurityPolicy, BackendTrafficPolicy, ClientTrafficPolicy).
  gateway:
    enabled: false
    name: eg
    namespace: envoy-gateway-system
    host: agent-sandbox-gateway.example.com
    timeouts:
      request: "3600s"

# ---------------------------------------------------------------------------
# Metrics / Prometheus (optional)
# ---------------------------------------------------------------------------
metrics:
  # enabled controls whether ServiceMonitor resources are created.
  # Requires the Prometheus Operator (kube-prometheus-stack) to be installed.
  enabled: false
  # Override ServiceMonitor resource names (empty = "<fullname>-{controller,extproc}-metrics-monitor").
  # Override only when adopting an existing ServiceMonitor — renaming would
  # leave the old one orphaned alongside the new one.
  controllerMonitorName: ""
  extprocMonitorName: ""

