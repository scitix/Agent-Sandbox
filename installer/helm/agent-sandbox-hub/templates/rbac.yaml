{{- if .Values.globalApiKey.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
---
# Role grants Secret CRUD (API keys) and ConfigMap CRUD (images catalog,
# notification config + runtime state) in the chart's release namespace on the
# master cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-apikey-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames:
      - {{ include "agent-sandbox-hub.imagesCatalogConfigMapName" . }}
      - {{ include "agent-sandbox-hub.notificationConfigMapName" . }}
    verbs: [get, create, update]
---
# Separate rule to allow creating the ConfigMaps above when they don't exist
# yet (resourceNames cannot be used with create on non-existent objects).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-images-catalog-creator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-apikey-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-apikey-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-sandbox-hub.proxyFullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-images-catalog-creator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-images-catalog-creator
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-sandbox-hub.proxyFullname" . }}
    namespace: {{ .Release.Namespace }}
---
# ClusterRole grants SandboxTemplate CRUD at cluster scope.
# ws-proxy uses the in-cluster ServiceAccount to list/sync SandboxTemplates
# across worker clusters via the template sync channel.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-template-manager
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [agents.navix.sh]
    resources: [sandboxtemplates]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-template-manager
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-template-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-sandbox-hub.proxyFullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.managedAgent.enabled }}
{{- $maNs := .Values.managedAgent.namespace | default .Release.Namespace }}
---
# The ManagedAgent controller needs a ServiceAccount even when the global API
# key feature is off, so create one here if that block did not.
{{- if not .Values.globalApiKey.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
---
{{- end }}
# Reconciling a ManagedAgent means owning the Brain's Deployment, Service and
# claim, and reading the Secrets and ConfigMaps it references so a rotation can
# be detected and rolled out.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-managedagent
  namespace: {{ $maNs }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
rules:
  # This Role is held by one ServiceAccount serving two callers: the reconciler,
  # which only reads agents and writes their status, and the console API, which
  # is where agents are created and deleted. The verbs are the union of both —
  # dropping create/delete leaves reconciliation healthy and every console
  # write failing.
  - apiGroups: [agents.navix.sh]
    resources: [managedagents]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agents.navix.sh]
    resources: [managedagents/status, managedagents/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [agents.navix.sh]
    resources: [sandboxenvs]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Claims are Get-then-Create only (applyPVC): a Bound claim's spec is
  # immutable apart from a size increase, so re-applying it would fail every
  # reconcile, and cleanup rides the OwnerReference — the garbage collector
  # deletes it under its own credentials, not ours. Granting delete here would
  # only add the ability to strand a Retain volume in Released.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create]
  # ConfigMaps are read for prompts and for change detection. Secrets are also
  # written: the platform collects an agent's API keys and materialises them,
  # and it generates the harness runtime config that pins the model provider.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election keeps a single reconciler active across a rollout, when the
  # old and new pods overlap.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-managedagent
  namespace: {{ $maNs }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}-managedagent
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-sandbox-hub.proxyFullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
