apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}-cluster-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
data:
  clusters.yaml: |
    clusters:
    {{- if .Values.clusters }}
    {{- .Values.clusters | toYaml | nindent 4 }}
    {{- else }}
      []
    {{- end }}
    hostAliases:
    {{- if .Values.hostAliases }}
    {{- .Values.hostAliases | toYaml | nindent 4 }}
    {{- else }}
      []
    {{- end }}
