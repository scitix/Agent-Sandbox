apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-sandbox-hub.proxySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-sandbox-hub.proxySelectorLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.globalApiKey.enabled .Values.managedAgent.enabled }}
      serviceAccountName: {{ include "agent-sandbox-hub.proxyFullname" . }}
      {{- end }}
      containers:
        - name: ws-proxy
          image: "{{ .Values.wsProxy.image.repository }}:{{ .Values.wsProxy.image.tag }}"
          imagePullPolicy: {{ .Values.wsProxy.image.pullPolicy }}
          ports:
            - containerPort: 9003
              protocol: TCP
            {{- if .Values.globalApiKey.enabled }}
            - containerPort: 9004
              protocol: TCP
            {{- end }}
          {{- if or .Values.globalApiKey.enabled .Values.managedAgent.enabled }}
          env:
          {{- end }}
          {{- if .Values.globalApiKey.enabled }}
          {{- if and .Values.prometheus.url .Values.prometheus.token }}
            # The notification service queries these directly; it does not go
            # through the dashboard BFF.
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: PROMETHEUS_TOKEN
          {{- end }}
            - name: AGENTBOX_NOTIFICATION_CONFIGMAP
              value: {{ include "agent-sandbox-hub.notificationConfigMapName" . | quote }}
          {{- if .Values.notification.feishu.webhookUrl }}
            - name: FEISHU_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: FEISHU_WEBHOOK_URL
          {{- end }}
          {{- end }}
          {{- if .Values.managedAgent.enabled }}
            - name: AGENTBOX_MANAGED_AGENT_ENABLED
              value: "1"
            - name: AGENTBOX_MANAGED_AGENT_NAMESPACE
              value: {{ .Values.managedAgent.namespace | default .Release.Namespace | quote }}
          {{- with .Values.managedAgent.brain.image }}
          {{- if .repository }}
            - name: AGENTBOX_MANAGED_AGENT_BRAIN_IMAGE
              value: {{ .repository | quote }}
            - name: AGENTBOX_MANAGED_AGENT_BRAIN_IMAGE_TAG
              value: {{ .tag | quote }}
          {{- if .pullSecrets }}
            - name: AGENTBOX_MANAGED_AGENT_BRAIN_PULL_SECRETS
              value: {{ join "," .pullSecrets | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.managedAgent.publish.enabled }}
            - name: WSPROXY_MANAGED_AGENT_GATEWAY_ADDR
              value: ":{{ .Values.managedAgent.publish.port }}"
            - name: WSPROXY_MANAGED_AGENT_PROXY_SERVICE
              value: "{{ include "agent-sandbox-hub.proxyFullname" . }}.{{ .Release.Namespace }}:{{ .Values.managedAgent.publish.port }}"
            - name: WSPROXY_MANAGED_AGENT_PUBLIC_BASE_URL
              value: {{ .Values.managedAgent.publish.baseURL | default (printf "https://%s%s/api/managed-agents" .Values.ingress.host (.Values.basePath | default "" | trimSuffix "/")) | quote }}
          {{- else }}
            # Empty disables the listener: an agent is not reachable from
            # outside merely because the controller runs.
            - name: WSPROXY_MANAGED_AGENT_GATEWAY_ADDR
              value: ""
          {{- end }}
          {{- end }}
          {{- if .Values.globalApiKey.enabled }}
            - name: AGENTBOX_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: AGENTBOX_SECRET
            - name: WSPROXY_INTERNAL_ADDR
              value: ":9004"
            - name: AGENTBOX_MAX_KEYS_PER_USER
              value: {{ .Values.globalApiKey.maxKeysPerUser | quote }}
            - name: AGENTBOX_APIKEY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AGENTBOX_IMAGES_CATALOG_CONFIGMAP
              value: {{ include "agent-sandbox-hub.imagesCatalogConfigMapName" . | quote }}
            - name: AGENTBOX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: AGENTBOX_ADMIN_KEY
          {{- end }}
          volumeMounts:
            - name: cluster-config
              mountPath: /etc/agentbox
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: cluster-config
          configMap:
            name: {{ include "agent-sandbox-hub.fullname" . }}-cluster-config
      {{- with .Values.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
