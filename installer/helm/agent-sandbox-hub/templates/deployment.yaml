apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-sandbox-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-sandbox-hub.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.globalApiKey.enabled }}
      serviceAccountName: {{ include "agent-sandbox-hub.proxyFullname" . }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: MULTI_CLUSTER_MODE
              value: {{ .Values.env.multiClusterMode | quote }}
            {{- if and .Values.image.tag (ne .Values.image.tag "latest") }}
            # Shown on the console's About panel. Read at request time by
            # /api/version rather than through NEXT_PUBLIC_APP_VERSION, which is
            # baked into the bundle at image-build time and so cannot name the
            # tag the image was eventually published under.
            #
            # Skipped for "latest", which would pin a value that never changes;
            # /api/version then falls back to the build-time constant.
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- end }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.env.apiUrl | quote }}
            # Kubernetes namespace where worker envoy / sandbox pods live.
            # Used by the dashboard's /api/prometheus/* routes to scope PromQL
            # selectors. Assumes hub and worker are installed in the same
            # namespace (the supported deployment topology).
            - name: AGENTBOX_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: AGENTBOX_SECRET
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            {{- if .Values.dex.enabled }}
            - name: DEX_ISSUER_URL
              value: {{ .Values.dex.issuerUrl | default "/dex" | quote }}
            - name: DEX_CLIENT_ID
              value: {{ .Values.dex.clientId | quote }}
            - name: DEX_REDIRECT_URI
              value: {{ .Values.dex.redirectUri | quote }}
            - name: DEX_USERINFO_URI
              value: {{ .Values.dex.userInfoUri | quote }}
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.dex.existingSecret }}
                  name: {{ .Values.dex.existingSecret | quote }}
                  {{- else }}
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  {{- end }}
                  key: DEX_CLIENT_SECRET
            - name: DEX_OIDC_ADMINS
              value: {{ .Values.dex.oidcAdmins | quote }}
            {{- end }}
            # Whether every conversation's sandbox gets ONE identity (the
            # assistant's own) or the caller's. Rendered from the same value
            # that sets SBX_IDENTITY_MODE on the assistant, because the BFF and
            # the daemon are two halves of one decision: with `static` the BFF
            # must not mint a per-person key, or it accumulates a credential per
            # person that nothing consumes and that `abx whoami` inside a
            # sandbox then contradicts.
            #
            # Outside the globalApiKey guard: it describes the assistant, not
            # key management, and a deployment that turns global keys off must
            # not silently fall back to minting one per person.
            - name: ASSISTANT_SANDBOX_IDENTITY_MODE
              value: {{ (((.Values.assistant | default dict).sandbox | default dict).identity | default dict).mode | default "session" | quote }}
            {{- if .Values.globalApiKey.enabled }}
            - name: WSPROXY_INTERNAL_URL
              value: "http://{{ include "agent-sandbox-hub.proxyFullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:9004"
            - name: AGENTBOX_MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: AGENTBOX_SECRET
            {{- end }}
            {{- if .Values.prometheus.url }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- if .Values.prometheus.token }}
            - name: PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: PROMETHEUS_TOKEN
            {{- end }}
            {{- end }}
            {{- if .Values.logs.downloadUrl }}
            - name: LOG_DOWNLOAD_URL
              value: {{ .Values.logs.downloadUrl | quote }}
            {{- if .Values.logs.appId }}
            # Set only for the signed auth scheme; its absence selects Bearer.
            - name: LOG_APP_ID
              value: {{ .Values.logs.appId | quote }}
            {{- end }}
            {{- if .Values.logs.project }}
            - name: LOG_PROJECT
              value: {{ .Values.logs.project | quote }}
            {{- end }}
            - name: LOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
                  key: LOG_TOKEN
            {{- end }}
          volumeMounts:
            - name: cluster-config
              mountPath: /etc/agentbox
              readOnly: true
          livenessProbe:
            httpGet:
              path: {{ .Values.basePath | default "" }}/api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.basePath | default "" }}/api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: cluster-config
          configMap:
            name: {{ include "agent-sandbox-hub.fullname" . }}-cluster-config
      {{- with .Values.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
