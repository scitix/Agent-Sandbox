{{- if .Values.imagesCatalog.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}-images-catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
data:
  images-catalog.json: |
    {{- if .Values.imagesCatalog.datasets }}
    {{- .Values.imagesCatalog.datasets | toJson | nindent 4 }}
    {{- else }}
    []
    {{- end }}
{{- end }}
