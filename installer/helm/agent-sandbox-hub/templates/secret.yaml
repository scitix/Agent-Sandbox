apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENTBOX_SECRET: {{ .Values.env.secret | quote }}
  {{- if and .Values.dex.enabled (not .Values.dex.existingSecret) }}
  DEX_CLIENT_SECRET: {{ .Values.dex.clientSecret | quote }}
  {{- end }}
  {{- if .Values.globalApiKey.enabled }}
  AGENTBOX_ADMIN_KEY: {{ .Values.globalApiKey.adminKey | quote }}
  {{- end }}
  {{- if and .Values.prometheus.url .Values.prometheus.token }}
  PROMETHEUS_TOKEN: {{ .Values.prometheus.token | quote }}
  {{- end }}
  {{- if .Values.logs.downloadUrl }}
  LOG_TOKEN: {{ .Values.logs.token | quote }}
  {{- end }}
  {{- if .Values.notification.feishu.webhookUrl }}
  FEISHU_WEBHOOK_URL: {{ .Values.notification.feishu.webhookUrl | quote }}
  {{- end }}
  {{- if include "agent-sandbox-hub.managedAgentInlineSandboxKey" . }}
  {{- /*
    Read by the Brain pods, not by ws-proxy: this Secret is the reference the
    controller renders for the default sandbox supply. That only resolves when the
    agents run in this namespace, which managedAgentDefaultHandsSecret enforces.
  */}}
  MANAGED_AGENT_SANDBOX_API_KEY: {{ .Values.managedAgent.hands.default.apiKey | quote }}
  {{- end }}
  {{- if include "agent-sandbox-hub.managedAgentInlineModelKey" . }}
  {{- /* Same arrangement as the sandbox key above, and read by the same pods. */}}
  MANAGED_AGENT_MODEL_API_KEY: {{ .Values.managedAgent.modelProvider.apiKey | quote }}
  {{- end }}
