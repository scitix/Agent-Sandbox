{{- if .Values.gateway.enabled }}
{{- $gatewayPath := .Values.basePath | default "/" }}
{{- $wsPath := printf "%s/ws" ($gatewayPath | trimSuffix "/") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $wsPath }}
      backendRefs:
        - name: {{ include "agent-sandbox-hub.proxyFullname" . }}
          port: 9003
    - matches:
        - path:
            type: PathPrefix
            value: {{ $gatewayPath }}
      backendRefs:
        - name: {{ include "agent-sandbox-hub.fullname" . }}
          port: 3000
---
# BackendTrafficPolicy: Replaces nginx proxy-read-timeout: "3600" annotation
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}-timeouts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "agent-sandbox-hub.fullname" . }}
  timeout:
    http:
      requestTimeout: {{ .Values.gateway.timeouts.request | default "3600s" }}
---
# ClientTrafficPolicy: Replaces nginx proxy-body-size: "50m" annotation
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "agent-sandbox-hub.fullname" . }}-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  http:
    maxRequestBodyBytes: 52428800
{{- end }}
