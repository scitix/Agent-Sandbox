apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox-hub.proxyFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-sandbox-hub.proxySelectorLabels" . | nindent 4 }}
  ports:
    - name: ws
      port: 9003
      targetPort: 9003
      protocol: TCP
    - name: internal
      port: 9004
      targetPort: 9004
{{- if and .Values.managedAgent.enabled .Values.managedAgent.publish.enabled }}
    - name: managed-agents
      port: {{ .Values.managedAgent.publish.port }}
      targetPort: {{ .Values.managedAgent.publish.port }}
{{- end }}
      protocol: TCP
