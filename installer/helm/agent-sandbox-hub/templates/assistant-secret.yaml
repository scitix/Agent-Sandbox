{{- $a := .Values.assistant | default dict }}
{{- $inlineModel := include "agent-sandbox-hub.assistantInlineModelKey" . }}
{{- $inlineSandbox := include "agent-sandbox-hub.assistantInlineSandboxKey" . }}
{{- if and $a.enabled (or $inlineModel $inlineSandbox) }}
{{- /* Rendered only when a key was inlined AND no existing Secret was named.
       Forcing a value with `required` instead would break chart-import tooling,
       which parses the chart with default values; a missing credential is a
       deploy-time failure, not an import-time one. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-sandbox-hub.assistantSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-sandbox-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: assistant
type: Opaque
stringData:
  {{- if $inlineModel }}
  MODEL_API_KEY: {{ $a.modelApiKey | quote }}
  {{- end }}
  {{- if $inlineSandbox }}
  E2B_API_KEY: {{ (($a.sandbox | default dict).apiKey) | quote }}
  {{- end }}
{{- end }}
