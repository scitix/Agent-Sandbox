# ---------------------------------------------------------------------------
# CRD installation
# ---------------------------------------------------------------------------
# The chart ships sandboxtemplates.agents.navix.sh under templates/crds/ so
# `helm upgrade` keeps its schema in sync. The CRD carries
# `helm.sh/resource-policy: keep`, so it survives `helm uninstall`.
#
# Set to false when the agent-sandbox-worker chart is installed in the same
# cluster — both charts ship the SandboxTemplate CRD, and only one should
# own it. (The worker chart additionally owns sandboxpools/sandboxenvs.)
crds:
  create: true

image:
  repository: ghcr.io/scitix/agent-sandbox-dashboard
  tag: latest
  pullPolicy: IfNotPresent

# Sub-path deployment configuration.
# basePath must match the value of NEXT_BASE_PATH used at Docker build time.
# "" (default) → root-path deployment  (xxx.com/)
# "/agentbox"  → sub-path deployment   (xxx.com/agentbox)
# Note: this value is informational for the Helm chart (used in Ingress path
# and health-probe paths). The actual basePath is baked into the image at
# build time via the NEXT_BASE_PATH Docker ARG.
basePath: ""

# Environment variables
env:
  # Shared secret (required) — used for dashboard session JWT signing, BFF↔ws-proxy
  # internal API auth, and ws-proxy↔Worker /v1/ws/sync auth. Every Worker chart's
  # controller.secrets.secret MUST be set to the same value.
  secret: "YOUR_AGENTBOX_SECRET"
  # Agent Sandbox controller API base URL (reachable from inside the dashboard pod)
  apiUrl: "http://localhost:8080"
  # Enable multi-cluster mode
  multiClusterMode: "true"

# Dex OIDC SSO configuration (optional).
# When dex.enabled is true, the four variables below are injected into the
# dashboard container so the BFF can perform OIDC Authorization Code Flow.
# Leave enabled: false (default) to keep the API-Key-only login experience.
dex:
  enabled: false
  # issuerUrl: Dex OIDC Discovery base URL.
  # Example: "https://console.example.com/dex"
  issuerUrl: ""
  # clientId: Dex staticClient id, e.g. "agent-sandbox"
  clientId: ""
  # redirectUri: must exactly match one entry in the Dex staticClient redirectURIs list.
  # Example: "https://console.example.com/agentbox/api/auth/oidc/callback"
  redirectUri: ""
  # userInfoUri: Console UserInfo endpoint URL
  userInfoUri: ""
  # clientSecret is sensitive — store it in a pre-existing Secret and reference it
  # via existingSecret, or set clientSecret directly (stored in a generated Secret).
  # Option A: reference an existing Secret that has a key named DEX_CLIENT_SECRET
  existingSecret: ""
  # Option B: set the secret inline (will be stored in the chart-managed Secret)
  clientSecret: ""
  # oidcAdmins: optional whitelist of OIDC admins.
  # Format: "org1:user1,user2;org2" (semicolon-separated entries,
  # colon separates org from users, comma separates users).
  # Omitting users (e.g. "org1" or "org1:") grants admin to the entire org.
  # Matching is case-insensitive.
  oidcAdmins: ""

# Cluster list for multi-cluster mode.
# Each entry describes a worker cluster that this dashboard manages.
# clusters:
#   - id: c92zj2qv5qco7yp7
#     name: "Worker Cluster 1"
#     url: http://10.0.0.1:30080
#     # selector is a full PromQL label-matcher expression, e.g.:
#     #   selector: 'cluster="cluster1"'
#     # When omitted, the default is `cluster="<id>"`.
#     selector: 'cluster="cluster1"'
#     headers:
#       Host: agent-sandbox.example.com
#     logs:
#       filters:
#         region: us-east-1
#         cluster: my-cluster
clusters: []

# In-process host-alias overrides propagated to every Worker cluster via the
# sync channel. Mirrors Kubernetes corev1.HostAlias semantics but is consumed
# by Go/gRPC components (ExtProc DNS cache + CrossClusterForwarder HTTP client).
# hostAliases:
#   - ip: "10.0.0.1"
#     hostnames:
#       - "loadbalancer-cluster1.example.com"
hostAliases: []

ingress:
  enabled: true
  className: nginx
  host: agent-sandbox-dashboard.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

# Gateway API alternative to ingress (use with Envoy Gateway or similar).
# Mutually exclusive with ingress; enable one or the other.
gateway:
  enabled: false
  name: eg
  namespace: envoy-gateway-system
  host: agent-sandbox-dashboard.example.com
  timeouts:
    request: "3600s"

nodeAffinity: {}
tolerations: []

# ws-proxy sidecar: WebSocket reverse proxy that bridges browser WS connections
# to the Agent Sandbox API worker WebSocket terminal endpoint.
wsProxy:
  image:
    repository: ghcr.io/scitix/agent-sandbox-wsproxy
    tag: latest
    pullPolicy: IfNotPresent

# Prometheus integration (optional).
# When prometheusUrl is set, the dashboard BFF will query Prometheus for metrics.
prometheus:
  url: ""
  token: ""

# External log service integration (optional).
logs:
  downloadUrl: ""
  appId: ""
  token: ""

# Platform notifications sent by ws-proxy: the daily usage report and the
# idle alert. Requires globalApiKey.enabled (the notification service runs in
# the same sync-manager scope) plus prometheus.url/token as its data source.
# The webhook is given here in plaintext and the chart moves it into the
# release Secret; leaving it empty disables sending.
notification:
  feishu:
    webhookUrl: ""

# Global API Key management via ws-proxy.
# When enabled:
#   - ws-proxy gains a Kubernetes ServiceAccount with Secret CRUD in the chart's release namespace.
#   - ws-proxy dials every Worker cluster's /v1/ws/sync endpoint (auth: env.secret).
#   - Dashboard BFF exposes /api/global-api-keys which delegates to ws-proxy
#     using the same env.secret as the bearer token for /internal/*.
globalApiKey:
  enabled: false
  maxKeysPerUser: 0
  adminKey: "" # AGENTBOX_ADMIN_KEY: wsproxy admin key for API key auth; empty = dev mode

# Images Catalog configuration.
# When enabled, the catalog is runtime-mutable state written by ws-proxy.
# Requires globalApiKey.enabled: true.
imagesCatalog:
  enabled: true
  # manageConfigMap controls whether the chart ships the catalog ConfigMap.
  #   true  (default): the chart renders the ConfigMap and preserves live data
  #                    across `helm upgrade` via `lookup` + resource-policy:keep.
  #                    Correct for server-side installs (helm install/upgrade).
  #   false: the chart does NOT render the ConfigMap; ws-proxy (syncmgr) becomes
  #          its sole owner — it bootstraps an empty object on startup and only
  #          the CRUD endpoints mutate it. Use this when the chart is rendered to
  #          static YAML and `kubectl apply`-ed, because `helm template` cannot
  #          `lookup` live data and would otherwise reset the catalog on re-apply.
  manageConfigMap: true

# ManagedAgent controller.
#
# A ManagedAgent hosts one agent: a Brain Deployment plus the sandbox supply it
# reaches for. It is reconciled HERE rather than by the worker's controller
# manager because the worker chart installs on every cluster — reconciling a
# control-plane object there would run one controller per cluster over a single
# set of resources.
#
# `namespace` is where the ManagedAgent objects and the Brains they own live.
# Empty means this chart's release namespace, which is the right default: an
# agent is a platform object, so it belongs beside the controller that
# reconciles it and the proxy that fronts it, and the credentials the platform
# materialises for it are namespace-scoped and land there too.
#
# Point it at a tenant's namespace only when the agents must reuse Secrets that
# already live there — the chart then grants ws-proxy a Role in that namespace
# instead. One namespace either way: the controller watches exactly one, since
# watching all of them needs cluster-wide grants this chart does not render.
managedAgent:
  enabled: false
  namespace: ""
  # Publishing an agent to callers outside the cluster. Off by default: an
  # agent that is merely deployed must not become reachable from the internet
  # as a side effect. With this on, each agent still has to opt in through its
  # own spec.ingress.enabled, and every request is authenticated.
  publish:
    enabled: false
    # Listener the ws-proxy serves published agents on. Kept apart from the
    # internal API (9004) on purpose: that one trusts a manager token and must
    # never be routable from outside.
    port: 9005
    # Base URL callers are told to use. Derived from the ingress host and base
    # path; set it explicitly when the two differ (TLS terminated elsewhere, a
    # vanity domain in front).
    baseURL: ""
    annotations: {}
