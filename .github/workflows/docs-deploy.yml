name: Deploy Docs

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/docs-deploy.yml"
      - "docs/website/**"
      - "pkg/openapi/native/openapi.yaml"

# Allow only one concurrent deployment; cancel any in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "docs/website/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        run: pnpm build
        env:
          NODE_ENV: production

      # Prevent Jekyll from interfering with Next.js static output.
      - name: Create .nojekyll file
        run: touch ./out/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
