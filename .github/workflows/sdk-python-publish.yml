name: Publish Python SDK (PyPI)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - develop
    paths:
      - "sdk/python/e2b/**"
      - ".github/workflows/sdk-python-publish.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # v0.0.1 → 0.0.1
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            # dev builds use a local version identifier (not published)
            VERSION="0.0.0.dev+${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Stamp version into __init__.py
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.version }}\"/" \
            sdk/python/e2b/agentbox/__init__.py

      - name: Build wheel and sdist
        working-directory: sdk/python/e2b
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdk/python/e2b/dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Only publish on tag pushes; develop branch only builds (dry-run)
    if: github.ref_type == 'tag'
    environment:
      name: pypi
      url: https://pypi.org/project/agent-sandbox-e2b/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # Required for OIDC Trusted Publisher
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed — uses OIDC Trusted Publisher configured on PyPI
