name: Build WSProxy Image

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "cmd/wsproxy/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.wsproxy"
      - ".github/workflows/build-wsproxy.yml"
  pull_request:
    paths:
      - "cmd/wsproxy/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.wsproxy"
      - ".github/workflows/build-wsproxy.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-wsproxy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/dockerfile/Dockerfile.wsproxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wsproxy
          cache-to: type=gha,scope=wsproxy,mode=max
