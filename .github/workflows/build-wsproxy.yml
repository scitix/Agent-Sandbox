name: Build WSProxy Image

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "cmd/wsproxy/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.wsproxy"
      - "installer/dockerfile/Dockerfile.wsproxy.runner"
      - ".github/workflows/build-wsproxy.yml"
  pull_request:
    paths:
      - "cmd/wsproxy/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.wsproxy"
      - "installer/dockerfile/Dockerfile.wsproxy.runner"
      - ".github/workflows/build-wsproxy.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-wsproxy

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/wsproxy-amd64 ./cmd/wsproxy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/wsproxy-arm64 ./cmd/wsproxy

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wsproxy-binaries
          path: bin/
          retention-days: 1

  build-image:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: wsproxy-binaries
          path: bin/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/dockerfile/Dockerfile.wsproxy.runner
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wsproxy-runner
          cache-to: type=gha,scope=wsproxy-runner,mode=max
