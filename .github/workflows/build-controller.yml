name: Build Controller Image

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "cmd/sandbox/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.controller"
      - "installer/dockerfile/Dockerfile.controller.runner"
      - ".github/workflows/build-controller.yml"
  pull_request:
    paths:
      - "cmd/sandbox/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.controller"
      - "installer/dockerfile/Dockerfile.controller.runner"
      - ".github/workflows/build-controller.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-controller

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile binaries
        run: |
          mkdir -p installer/dockerfile/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o installer/dockerfile/bin/sandbox-amd64 ./cmd/sandbox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o installer/dockerfile/bin/sandbox-arm64 ./cmd/sandbox

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: controller-binaries
          path: installer/dockerfile/bin/
          retention-days: 1

  build-image:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: controller-binaries
          path: installer/dockerfile/bin/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/dockerfile/Dockerfile.controller.runner
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller-runner
          cache-to: type=gha,scope=controller-runner,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old non-release images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-controller
          delete-untagged: true
          keep-at-most: 3
          skip-tags: v*
        continue-on-error: true
