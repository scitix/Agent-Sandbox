name: Build Controller Image

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "cmd/sandbox/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.controller"
      - ".github/workflows/build-controller.yml"
  pull_request:
    paths:
      - "cmd/sandbox/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "installer/dockerfile/Dockerfile.controller"
      - ".github/workflows/build-controller.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-controller

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for pushing to GHCR. PR builds don't push so this is safely no-op for forks.
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate only for push events / tag pushes on the canonical repo.
      # Pull requests from forks have no packages:write permission, so the
      # login step would fail — skip it and build without pushing.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag strategy:
          #   branch push           → ${branch} (e.g. main, develop)
          #   v1.2.3 tag push       → 1.2.3 / 1.2 / 1 / latest
          #   any push              → sha-<short>
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/dockerfile/Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,scope=controller,mode=max
