name: Build Brain Image

# The assistant's conversation layer: the Bun gateway plus the harnesses it
# drives. Its Dockerfile takes the REPOSITORY ROOT as its context, because the
# image needs both `brain/` and `sdk/hands/` from the same commit — the gateway
# depends on the hands package through a `file:` reference, so a build carrying
# only one of them resolves against whatever the other happened to be.

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "brain/**"
      - "sdk/hands/**"
      - ".github/workflows/build-brain.yml"
  pull_request:
    paths:
      - "brain/**"
      - "sdk/hands/**"
      - ".github/workflows/build-brain.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-brain

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: brain/Dockerfile
          # arm64 is reachable because the OpenCode stage selects its binary from
          # TARGETARCH rather than from the build machine's /proc/cpuinfo.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brain
          cache-to: type=gha,scope=brain,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old non-release images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-brain
          delete-untagged: true
          keep-at-most: 3
          skip-tags: "*.*.*,latest"
        continue-on-error: true
