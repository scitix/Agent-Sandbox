name: Build envd and tini Images

on:
  push:
    branches: [main, develop]
    paths:
      - "installer/runtimes/envd/**"
  workflow_dispatch:
    inputs:
      infra_ref:
        description: "e2b-infra git ref to checkout (branch, tag, or commit SHA)"
        required: false
        # Pinned to envd 0.6.1. MUST match build-envd.sh's INFRA_REF and the
        # base the patches in installer/runtimes/envd/patches/ were generated
        # against — the apply step below fails the build if they drift.
        default: "1d930ee60fd74b3ad1d5c167165b1005baa471fe"
      tini_version:
        description: "tini version to package (e.g. v0.19.0)"
        required: false
        default: "v0.19.0"
      tini_image_tag:
        description: "tag for the tini image; defaults to <tini_version>-static"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  REPOSITORY: scitix

jobs:
  build-envd:
    name: Build envd from e2b-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      envd_version: ${{ steps.build.outputs.envd_version }}

    steps:
      - name: Checkout agent-sandbox
        uses: actions/checkout@v4

      - name: Checkout e2b-infra
        uses: actions/checkout@v4
        with:
          repository: e2b-dev/infra
          ref: ${{ github.event.inputs.infra_ref || '1d930ee60fd74b3ad1d5c167165b1005baa471fe' }}
          path: e2b-infra

      # Apply our carried-forward envd patches BEFORE building. Without this the
      # CI image is an UNPATCHED upstream envd (the OOM-wrapper bug that breaks
      # exec under Kubernetes is back). A reject means the pinned infra_ref drifted
      # from the patch base — rebase the patches and bump both refs. See
      # installer/runtimes/envd/patches/README.md.
      - name: Apply ScitiX envd patches
        working-directory: e2b-infra
        run: |
          for patch in "${{ github.workspace }}"/installer/runtimes/envd/patches/*.patch; do
            [ -e "$patch" ] || continue
            echo "Applying $(basename "$patch")"
            git apply --verbose "$patch"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2b-infra/packages/envd/go.mod
          cache: true
          cache-dependency-path: e2b-infra/packages/envd/go.sum

      - name: Build envd binary
        id: build
        working-directory: e2b-infra/packages/envd
        run: |
          make build
          if [ ! -f bin/envd ]; then
            echo "Error: bin/envd not found after make build"
            exit 1
          fi
          ENVD_VERSION=$(./bin/envd --version | awk '{print $NF}')
          echo "envd_version=${ENVD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected envd version: ${ENVD_VERSION}"
          cp bin/envd ${{ github.workspace }}/installer/runtimes/envd/envd

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push envd image
        uses: docker/build-push-action@v6
        with:
          context: installer/runtimes/envd
          file: installer/runtimes/envd/Dockerfile.envd
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ENVD_VERSION=${{ steps.build.outputs.envd_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/agent-sandbox-envd:${{ steps.build.outputs.envd_version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/agent-sandbox-envd:latest
          cache-from: type=gha,scope=envd
          cache-to: type=gha,mode=max,scope=envd

  build-tini:
    name: Build tini image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout agent-sandbox
        uses: actions/checkout@v4

      - name: Resolve tini version
        id: tini
        run: |
          TINI_VERSION="${{ github.event.inputs.tini_version || 'v0.19.0' }}"
          TINI_IMAGE_TAG="${{ github.event.inputs.tini_image_tag }}"
          if [ -z "$TINI_IMAGE_TAG" ]; then
            TINI_IMAGE_TAG="${TINI_VERSION}-static"
          fi
          echo "tini_version=${TINI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tini_image_tag=${TINI_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push tini image
        uses: docker/build-push-action@v6
        with:
          context: installer/runtimes/envd
          file: installer/runtimes/envd/Dockerfile.tini
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TINI_VERSION=${{ steps.tini.outputs.tini_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/agent-sandbox-tini:${{ steps.tini.outputs.tini_image_tag }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/agent-sandbox-tini:latest
          cache-from: type=gha,scope=tini
          cache-to: type=gha,mode=max,scope=tini
