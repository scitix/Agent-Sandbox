name: Publish Helm Charts

on:
  push:
    branches: [main]
    paths:
      - "installer/helm/**"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: scitix

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint charts before publishing
        run: |
          helm lint installer/helm/agent-sandbox-worker --strict
          helm lint installer/helm/agent-sandbox-hub --strict

      - name: Publish agent-sandbox-worker chart
        run: |
          helm package installer/helm/agent-sandbox-worker
          CHART_VERSION=$(helm show chart installer/helm/agent-sandbox-worker | grep '^version:' | awk '{print $2}')
          CHART_NAME=$(helm show chart installer/helm/agent-sandbox-worker | grep '^name:' | awk '{print $2}')
          echo "Publishing ${CHART_NAME}:${CHART_VERSION}"
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          echo "Published ${CHART_NAME}:${CHART_VERSION} to ${{ env.REGISTRY }}/${{ env.REPOSITORY }}"

      - name: Publish agent-sandbox-hub chart
        run: |
          helm package installer/helm/agent-sandbox-hub
          CHART_VERSION=$(helm show chart installer/helm/agent-sandbox-hub | grep '^version:' | awk '{print $2}')
          CHART_NAME=$(helm show chart installer/helm/agent-sandbox-hub | grep '^name:' | awk '{print $2}')
          echo "Publishing ${CHART_NAME}:${CHART_VERSION}"
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          echo "Published ${CHART_NAME}:${CHART_VERSION} to ${{ env.REGISTRY }}/${{ env.REPOSITORY }}"

  cleanup-old-versions:
    runs-on: ubuntu-latest
    needs: publish-charts
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old agent-sandbox-worker chart versions
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-worker
          delete-untagged: true
          keep-at-most: 10
          skip-tags: latest
        continue-on-error: true

      - name: Clean up old agent-sandbox-hub chart versions
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-hub
          delete-untagged: true
          keep-at-most: 10
          skip-tags: latest
        continue-on-error: true
