name: Docs Build

on:
  pull_request:
    paths:
      - ".github/workflows/docs-build.yml"
      - "docs/website/**"
      - "pkg/openapi/native/openapi.yaml"

jobs:
  build:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "docs/website/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        run: pnpm build
        env:
          NODE_ENV: production
