name: Build Hands Image

# The assistant's sandbox: `abx` plus the E2B SDK. Paired with the Brain image —
# a gateway and a sandbox built from different commits is the one combination
# nothing downstream checks, so both are triggered by any change to the CLI's
# sources as well as to their own.

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "cli/**"
      - "headless/**"
      - "plugin/skills/**"
      - "installer/dockerfile/Dockerfile.hands"
      - ".github/workflows/build-hands.yml"
  pull_request:
    paths:
      - "cli/**"
      - "headless/**"
      - "plugin/skills/**"
      - "installer/dockerfile/Dockerfile.hands"
      - ".github/workflows/build-hands.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-hands

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/dockerfile/Dockerfile.hands
          # amd64 only: the E2B code-interpreter base image this derives from
          # publishes no arm64 manifest, and a build that cross-compiles the
          # abx stage only to fail on the base image's FROM wastes the whole run.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_NAME=agent-sandbox-hands
            IMAGE_TAG=${{ github.sha }}
          cache-from: type=gha,scope=hands
          cache-to: type=gha,scope=hands,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old non-release images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-hands
          delete-untagged: true
          keep-at-most: 3
          skip-tags: "*.*.*,latest"
        continue-on-error: true
