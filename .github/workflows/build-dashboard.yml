name: Build Dashboard Image

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "dashboard/**"
      - "installer/dockerfile/Dockerfile.dashboard"
      - "installer/dockerfile/Dockerfile.dashboard.runner"
      - ".github/workflows/build-dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "installer/dockerfile/Dockerfile.dashboard"
      - "installer/dockerfile/Dockerfile.dashboard.runner"
      - ".github/workflows/build-dashboard.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-dashboard

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm i18n:validate

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-assets:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve build version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
          else
            SHORT="${{ github.sha }}"
            VER="$(cat VERSION)+dev.${SHORT:0:7}"
          fi
          echo "value=${VER}" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: dashboard
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.value }}
        run: pnpm build

      - name: Collect artifacts
        run: |
          mkdir -p dashboard/build
          cp -r dashboard/.next/standalone dashboard/build/standalone
          cp -r dashboard/.next/static      dashboard/build/static
          cp -r dashboard/public            dashboard/build/public

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build/
          retention-days: 1

  build-image:
    runs-on: ubuntu-latest
    needs: build-assets
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: installer/dockerfile/Dockerfile.dashboard.runner
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard-runner
          cache-to: type=gha,scope=dashboard-runner,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old non-release images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-dashboard
          delete-untagged: true
          keep-at-most: 3
          skip-tags: "*.*.*,latest"
        continue-on-error: true
