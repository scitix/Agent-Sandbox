name: Lint and Validate Helm Charts

on:
  push:
    branches: [main, develop]
    paths:
      - "installer/helm/**"
  pull_request:
    paths:
      - "installer/helm/**"

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint agent-sandbox chart
        run: helm lint installer/helm/agent-sandbox --strict

      - name: Lint agent-sandbox-dashboard chart
        run: helm lint installer/helm/dashboard --strict

      - name: Template agent-sandbox chart (default values)
        run: |
          helm template test-release installer/helm/agent-sandbox \
            --namespace agentbox-system \
            --set controller.secrets.adminKey=test-admin-key \
            --set controller.secrets.syncToken=test-sync-token \
            --set controller.secrets.jwtSecret=test-jwt-secret \
            > /dev/null

      - name: Template agent-sandbox-dashboard chart (default values)
        run: |
          helm template test-release installer/helm/dashboard \
            --namespace agentbox-system \
            --set env.jwtSecret=test-jwt-secret \
            > /dev/null

      - name: Template agent-sandbox-dashboard chart (globalApiKey enabled)
        run: |
          helm template test-release installer/helm/dashboard \
            --namespace agentbox-system \
            --set env.jwtSecret=test-jwt-secret \
            --set globalApiKey.enabled=true \
            --set globalApiKey.token=test-token \
            > /dev/null

      - name: Template agent-sandbox-dashboard chart (dex enabled)
        run: |
          helm template test-release installer/helm/dashboard \
            --namespace agentbox-system \
            --set env.jwtSecret=test-jwt-secret \
            --set dex.enabled=true \
            --set dex.issuerUrl=https://dex.example.com \
            --set dex.clientId=agent-sandbox \
            --set dex.clientSecret=test-secret \
            --set dex.redirectUri=https://example.com/callback \
            --set dex.userInfoUri=https://example.com/userinfo \
            > /dev/null

      - name: Template agent-sandbox chart (metrics enabled)
        run: |
          helm template test-release installer/helm/agent-sandbox \
            --namespace agentbox-system \
            --set controller.secrets.adminKey=test \
            --set controller.secrets.syncToken=test \
            --set controller.secrets.jwtSecret=test \
            --set metrics.enabled=true \
            > /dev/null

      - name: Verify chart versions are consistent
        run: |
          echo "Checking Chart.yaml versions..."
          for chart in installer/helm/agent-sandbox installer/helm/dashboard; do
            name=$(grep '^name:' "$chart/Chart.yaml" | awk '{print $2}')
            version=$(grep '^version:' "$chart/Chart.yaml" | awk '{print $2}')
            echo "  $name: $version"
          done
