name: Build Idle Image

# The idle image is what every pre-warmed sandbox pod runs while sitting in the
# pool. It also bundles the egress-proxy binary (compiled from cmd/egressproxy),
# so it is rebuilt when its Dockerfile OR the egress-proxy source changes.

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths:
      - "installer/dockerfile/Dockerfile.idleimage"
      - ".github/workflows/build-idleimage.yml"
      - "cmd/egressproxy/**"
      - "pkg/egressproxy/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "installer/dockerfile/Dockerfile.idleimage"
      - ".github/workflows/build-idleimage.yml"
      - "cmd/egressproxy/**"
      - "pkg/egressproxy/**"
      - "go.mod"
      - "go.sum"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-idle

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/dockerfile/Dockerfile.idleimage
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cleanup:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean up old non-release images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: org
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          package-name: agent-sandbox-idle
          delete-untagged: true
          keep-at-most: 3
          skip-tags: "*.*.*,latest"
        continue-on-error: true
