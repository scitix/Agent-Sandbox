# SandboxEnv: a warm pool of sandboxes that have Docker inside them.
#
# The same shape as e2b-basic_sandboxenv.yaml, on the template that runs dockerd
# inside the sandbox. Smaller default capacity, because a container engine plus
# whatever it builds needs more of the node than a plain E2B sandbox does.
#
#   `kubectl apply -f config/samples/e2b-docker_sandboxenv.yaml`
#
# A privileged workload: read the warning at the top of
# e2b-docker_sandboxtemplate.yaml before pointing anything untrusted at it, and
# consider e2b-kata_sandboxenv.yaml — the same sandbox, in its own kernel.
apiVersion: agents.navix.sh/v1alpha1
kind: SandboxEnv
metadata:
  name: e2b-docker
spec:
  templateRef:
    name: e2b-envd-docker
  mode: WarmPool
  autoscaling:
    groups:
      - name: 2c4gi
        enabled: true
        minReplicas: 0
        maxReplicas: 2
  clusters:
    - clusterID: YOUR_CLUSTER_ID
      members:
        - name: e2b-docker-2c4gi
          config:
            scalingGroup: 2c4gi
            inlineResources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "2"
                memory: 4Gi
          spec:
            replicas: 1
