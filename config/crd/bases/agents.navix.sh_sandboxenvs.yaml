---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sandboxenvs.agents.navix.sh
spec:
  group: agents.navix.sh
  names:
    kind: SandboxEnv
    listKind: SandboxEnvList
    plural: sandboxenvs
    shortNames:
    - sbe
    singular: sandboxenv
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.templateRef.name
      name: Template
      type: string
    - jsonPath: .status.memberCount
      name: Members
      type: integer
    - jsonPath: .status.runningReplicas
      name: Running
      type: integer
    - jsonPath: .status.idleReplicas
