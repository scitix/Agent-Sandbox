[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox-e2b"
dynamic = ["version"]
description = "agent-sandbox E2B SDK patch — one-line switch to use Agent Sandbox via the E2B Python SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# e2b is a real dependency, upper-bounded at release time to the newest version
# the release was checked against (see .github/workflows/sdk-python-publish.yml).
# The patch reaches into SDK internals, and a new SDK can call API routes an
# Agent Sandbox server does not serve yet, so an unchecked e2b is not a safe
# default. The `e2b` extra is kept so existing `agent-sandbox-e2b[e2b]`
# requirements still resolve.
dependencies = ["e2b>=2.0.0"]

[project.optional-dependencies]
e2b = ["e2b>=2.0.0"]
dev = ["e2b>=2.0.0", "ruff>=0.4.0", "httpx>=0.27.0"]

[tool.setuptools.dynamic]
version = {attr = "agent_sandbox_e2b.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_sandbox_e2b*"]

[project.urls]
Homepage = "https://github.com/scitix/agent-sandbox"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
