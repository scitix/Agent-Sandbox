[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbox-sdk"
version = "0.0.0"
description = "AgentBox Python SDK — manage Sandboxes, Pools, and Templates via async/await"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
    "attrs>=22.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
abx = "agentbox_sdk.cli.main:main"

[project.optional-dependencies]
dev = [
    "openapi-python-client>=0.21.0",
    # For scripts/gen_body_docs.py, which reads the OpenAPI spec. A DEV
    # dependency only: what it emits is plain Python, so the CLI itself never
    # parses YAML. It is here rather than left to `uv run --with` so the
    # staleness check can actually run in CI — a guard that skips itself where
    # it matters is not a guard.
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentbox_sdk*"]

[project.urls]
Homepage = "https://github.com/scitix/agent-sandbox"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py39"
exclude = [
    "agentbox_sdk/_generated",
    # Generated from the OpenAPI spec (scripts/gen_body_docs.py). Its long
    # lines are the schema's own descriptions, and reflowing them would be
    # editing a generated file.
    "agentbox_sdk/cli/_body_docs.py",
    "__pycache__",
    ".git",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
